        testimonials:
            tag: 服務機構
            introduction: 在 Kimai，我們設計工時追蹤平台時，同時考量服務機構、團隊與自由工作者的需求。直覺式介面和強大功能可協助像您一樣的服務機構更聰明地工作並提升獲利。現在就來「聽聽」真實使用者的評價。
            title: 服務機構如何評價工時追蹤
        about:
            title: 改善工時追蹤的第一步
            introduction: |
                您已踏出第一步，相信現在能做出明智選擇。要挑選最適合的工時追蹤軟體，還應考量哪些事項？有些供應商提供可能受限的免費版本，其他供應商則依企業規模或使用者人數提供免費體驗版本、試用或定價方案。

                Kimai 提供免費試用，讓您先探索解決方案，再決定是否需要更多使用者、功能或外掛程式。立即免費試用，讓工作日更有條理！
        title: 適合服務機構的工時追蹤
        cta:
            title: |
                準備好開始
                追蹤機構工時了嗎？
        name: 服務機構
        introduction: |
            您是否經營服務機構——無論是行銷、公關、設計、顧問、人力資源或建築領域？那麼您一定知道工時追蹤對業務有多重要。追蹤員工工時與客戶專案時間，是正確請款、掌握獲利能力及管理成長中團隊的關鍵。

            但以試算表和彼此獨立的工具管理工時追蹤，很快就會變得一團混亂，尤其是在機構規模擴大時。這正是專用工時追蹤解決方案能徹底改變工作方式之處。

            讓我們瞭解成功的服務機構為何仰賴工時追蹤軟體，以及應尋找哪些必要功能。我們會以專為服務機構打造、容易使用的 Kimai 為例。
        intro: 可擴充的工時追蹤系統，為快速成長的服務機構釋放獲利潛力
        subtitle: 提升獲利能力的關鍵
    lawyer:
        about:
            title: 改善法律業務工時追蹤的第一步
            introduction: |
                我們瞭解，在法律業務中嘗試新軟體可能令人卻步。因此，我們提供免費且無須承諾的試用、簡單的導入流程、能隨事務所或團隊成長的彈性功能，以及專屬支援。

