    subtitle: Каждый случай использования, каждая компания и каждый рабочий процесс уникальны, и Ваши требования должны быть оценены перед принятием решения о системе учета времени. Тут есть некоторые популярные альтернативы Kimai, которые мы рассмотрим подробно.
    name: Compare time tracker
    description: Kimai - это лучшее приложение с открытым исходным кодом для учета времени, доступное не только для команд, работающих над проектами. Узнайте, как Kimai сравнивается с альтернативными решениями для учета времени, чтобы вы могли выбрать подходящее для вашей организации.
feature:
    mobile-ready:
        name: "Поддержка мобильных устройств"
        description: "Макет полностью адаптивный, созданный для настольных и мобильных устройств. Каждый пользователь может настроить столбцы данных, которые должны отображаться, например, для избежания горизонтальной прокрутки на небольших устройствах."
    plugins:
        name: "Плагины"
        description: "Kimai построен с возможностью расширения набора функций с помощью плагинов. Разработчик, который хочет создать плагин для Kimai, может использовать множество точек расширения."
    multi-user:
        name: "Многопользовательский"
        description: "Kimai может использоваться любым количеством пользователей: каждая установка поддерживает неограниченное количество пользователей с различными ролями (см. разрешения)."
    multi-language:
        name: "Многоязычность"
        description: "Kimai может быть переведён на любой язык, и уже переведён более чем на 30 языков."
    teams:
        name: "Команды"
        description: "Команды объединяют пользователей в логические группы, например отделы. Ограничьте доступ к данным, назначив клиентов и проекты своим командам."
    customers:
        name: "Клиенты"
        description: "Управляйте своими клиентами и добавляйте адрес, контакты, страну, валюту, видимость (для архивирования) и многие другие поля."
    projects:
        name: "Проекты"
        description: "Управляйте проектами для каждого клиента с номером заказа, бюджетом и видимостью (для архивирования)."
    activities:
        name: "Активности"
        description: "Активности используются для привязки единицы работы к записям табеля. Управляйте активностями для каждого проекта с номером заказа, бюджетом и видимостью (для архивирования) или создавайте глобальные, чтобы избежать дублирования."
    invoices:
        name: "Выставление счетов"
        description: "Настраиваемые шаблоны счетов, параметры группировки записей, настраиваемые номера счетов и несколько форматов, таких как PDF и DOCX."
    export:
        name: "Экспорт данных"
        description: "Данные табеля можно экспортировать и передавать в форматах XLSX, PDF, CSV и HTML. Экспортированные записи можно заблокировать и защитить от дальнейших изменений."
    expenses:
        name: "Расходы"
        description: "Отслеживайте свои расходы по клиентам, проектам и активностям. Эти расходы можно распределять по категориям и включать в счета-фактуры. Обратите внимание: отслеживание расходов доступно только в платном плагине."
    saml:
        name: "SAML"
        description: "Входите в систему и регистрируйте пользователей с помощью SAML через существующего поставщика идентификации SSO, например Google Workspace, Authentik или Azure Active Directory."
    api:
        name: "JSON API"
        description: "Обширный JSON API для чтения и записи данных, чтобы внешние приложения и пользовательские инструменты могли взаимодействовать с Kimai."
    ldap:
        name: "LDAP"
        description: "Подключите Kimai к серверу каталогов своей компании (LDAP или Active Directory) и используйте существующую инфраструктуру аутентификации."
    statistics:
        name: "Статистика"
        description: "Ваша информпанель покажет вам некоторую статистику о записанном времени и о количестве собранных данных. И мы всегда можем добавить другие диаграммы!"
    docker:
        name: "Docker"
        description: "Выпуск включает в себя образ Docker для разработки и отдельную установку Docker-compose для рабочей среды."
    migrate-v1:
        name: "Миграция"
        description: "Данные из Kimai вер. 1 могут быть импортированы для беспрепятственной миграции вашего регистратора времени."
    active-entries:
        name: "Количество активных записей"
        description: "Вы можете вести параллельную запись сколько угодно раз, но при этом можно настроить допустимый лимит активных записей до 1."
    am-pm-format:
        name: "Формат AM/PM"
        description: "Kimai использует локализованную версию 24-часового формата. Но если вы привыкли к формату am/pm, можете настроить его."
    time-clock:
        name: "Секундомер"
        description: "Не хотите, чтобы ваши пользователи регистрировали произвольные записи в табеле? Переключитесь в режим секундомера, который позволяет делать только записи «старт» и «стоп»."
    duration-only:
        name: "Только продолжительность"
        description: "Если местные законы требуют, чтобы вы показывали только длительность вместо времени начала и окончания, вы можете активировать этот режим глобально."
    rates:
        name: "Расчёт тарифа"
        description: "Ставки могут рассчитываться на основе почасовых и фиксированных сумм, настраиваться для клиентов, проектов, видов активности и для каждой записи табеля в отдельности."
    timesheet-filter:
        name: "Фильтры табеля"
        description: "Вы можете фильтровать все записи времени по пользователю, клиенту, проекту, активности и дате."
    permissions:
        name: "Разрешения"
        description: "Гибкая структура прав доступа. Назначайте пользователям различные роли, например, пользователи могут регистрировать время, лидеры команд могут печатать счета и настраивать проекты/активности, администраторы могут настраивать учётные записи пользователей и клиентов."
    user-profile:
        name: "Профиль пользователя"
        description: "Личная статистика и настройки почасовой оплаты, темы Kimai, пароля и аватара для каждого пользователя."
    password-reset:
        name: "Сброс пароля"
        description: "Забыли пароль? Нет проблем, Kimai позаботился о вас, предоставив возможность сброса пароля по электронной почте."
    2fa:
        description: 'Kimai поддерживает двухфакторную аутентификацию с использованием TOTP-токенов: обеспечьте безопасность ваших учетных записей сегодня!'
        name: Двухфакторная аутентификация (2FA)
    auth:
        description: Kimai поддерживает внешние поставщики идентификации и вход через LDAP и SAML на нескольких платформах (например, Google Workspace, Azure AD или Authentik). Кроме того, можно включить двухфакторную аутентификацию с использованием TOTP-токенов.
        name: Аутентификация и безопасность
    reporting:
        description: Анализ записанного времени по пользователям, клиентам, проектам, активностям, меткам, временным периодам и многому другому.
        name: Отчеты и анализы
    dark-mode:
        name: Тёмный режим
        description: Потому что каждому приложению нужен тёмный режим, который помогает снизить нагрузку на глаза вечером или в тёмных помещениях.
    customer-portal:
        description: Делитесь статистикой по клиентам и проектам, а также табелями с кем угодно, используя секретный URL, при желании защищённый паролем.
        name: Портал клиента
    security:
        points:
            security_6: Автоматическое тестирование кода с покрытием выше 90%
            security_4: Непрерывная интеграция с тысячами проверок
            security_1: Безопасное хеширование паролей с помощью Argon2 или Sodium
            security_5: Углублённые обзоры кода
            security_2: Детализированные роли пользователей, ограничивающие доступ
            security_3: Защита от CSRF и XSS
        description: Kimai применяет лучшие практики проектирования приложений для предотвращения распространённых атак. Автоматизированные средства контроля безопасности критически важны для любого рабочего процесса разработки программного обеспечения, чтобы сократить время от создания до обнаружения дефекта. Эти сканирования выполняются при каждом изменении кода, каждый раз.
        name: Безопасность в Kimai
    security-cloud:
        points:
            security_1: Все соединения защищены через TLS (SSL)
            security_2: Безопасность по лучшим практикам, межсетевые экраны и защита от перебора
            security_6: Код выполняется в строго ограниченных доменных средах
            security_3: 'Без мультитенантности: у каждого клиента своя база данных'
            security_4: Серверы размещены в дата-центре в ЕС
            security_5: Критически важные службы недоступны из внешнего мира
        name: Безопасность на платформе
        description: Программное обеспечение настолько безопасно, насколько безопасна система, на которой оно работает. Я применяю многоуровневый подход к защите серверной и сетевой инфраструктуры. Клиенты на хостинговой платформе защищены множеством уровней защиты.
    privacy:
        name: Конфиденциальность прежде всего
        description: Я уважаю вашу конфиденциальность, конфиденциальность ваших пользователей и их данные. Нет, это не очередное скучное введение в политику конфиденциальности — так я веду этот бизнес. Я не продаю данные. Я соблюдаю GDPR и отвечу на любой вопрос о привлечённых субпроцессорах.
    no-limits:
        description: "Ваше SaaS-приложение всегда имеет ограничения? Только не Kimai: здесь нет ограничений. Вы платите только за количество активных пользователей. Я не ограничиваю вас и не беру плату за неактивных пользователей. Вы можете создать неограниченное количество пользователей, клиентов, проектов, активностей, табелей и многого другого."
        name: Не знает ограничений
    electronic-invoicing:
        name: Электронные счета
        description: Создавайте электронные счета в форматах XML и PDF/A, соответствующие EN 16931, XRechnung 3.0, Zugferd/Factur-X, с использованием синтаксиса CII и UBL
    eu-hosting:
        description: Независимый и европейский 🇪🇺 — создан в Австрии 🇦🇹 и размещён в Германии 🇩🇪
        name: Хостинг в ЕС
install:
    alert-vps: На данном этапе невозможно установить Kimai, скачав ZIP-файл и загрузив файлы на свой веб-сервер. Это связано с тем, что Composer должен запускаться из командной строки. Это не обязательно означает, что вам нужен VPS. Некоторые виртуальные хосты предоставляют доступ к SSH, через который вы сможете установить Composer и Kimai.
    ssh: Этот метод устанавливает Kimai непосредственно на ваш сервер.
    cloud: Нет необходимости устанавливать Kimai, вы можете начать использовать его прямо сейчас.
    docker: Используйте наш образ Docker для установки и обновления контейнера Kimai с легкостью.
    kubernetes: Вы можете развернуть Kimai в Kubernetes, используя наши Helm-чарты.
    caddy-docker: Использование Docker-Compose и Caddy в качестве обратного прокси с поддержкой SSL.
donate: Пожертвовать
newsletter:
