faqs:
    partner_program:
        question_1:
            question: "Что означает статус Официального партнёра Kimai?"
            answer: "**Официальный партнёр Kimai** — это статус, который Kimai присваивает компаниям и разработчикам, подтвердившим глубокое знание платформы и действующим в соответствии с ценностями Kimai. Партнёры работают независимо; при необходимости Kimai помогает установить контакт, но не участвует в проектах, которые партнёры выполняют для своих клиентов."
        question_2:
            question: "Что означает партнёрский значок и как его использовать?"
            answer: "Партнёрский значок показывает клиентам, что опыт партнёра проверен и признан Kimai. Статус действует один год и продлевается после проверки. Пока статус действует, партнёр может называть себя **Официальным партнёром Kimai** и размещать партнёрский значок на своём сайте, в маркетинговых материалах и в общении с клиентами."
        question_3:
            question: "Кто может участвовать в партнёрской программе Kimai?"
            answer: |
                Компании и частные лица, желающие стать Официальными партнёрами Kimai, должны соответствовать определённым минимальным требованиям:
                - достойное профессиональное присутствие
                - подтверждённый опыт работы с Kimai
                - уважительное отношение к открытому ПО и сообществу
                - актуальные знания о поддерживаемых версиях Kimai
                - не менее 3 клиентских проектов или 12 месяцев опыта работы с Kimai
                - как минимум одно назначенное техническое контактное лицо
                - имеющиеся отзывы клиентов или кейсы.
        question_4:
            question: "Как проходит процесс присвоения статуса партнёра?"
            answer: "На первом этапе компания или частное лицо, желающее стать Официальным партнёром Kimai, подаёт заявку, как описано на странице **Стать партнёром**. Если минимальные требования выполнены, назначается онлайн-собеседование. После успешного собеседования и принятия условий программы заявитель получает статус **Официального партнёра Kimai**."
        question_5:
            question: "Берёт ли Kimai комиссию за связь партнёров с клиентами?"
            answer: "Да — на первый заказ, полученный через каталог партнёров Kimai или по прямой рекомендации Kimai, начисляется агентская комиссия в размере 10 %. Эта комиссия финансирует работу и дальнейшее развитие партнёрской программы, каталога партнёров и магазина плагинов, через которые партнёров находят и делают их услуги заметными."
        question_6:
            question: "Существует ли рейтинг партнёров?"
            answer: "В настоящее время рейтинговой системы нет. Статус **Официального партнёра Kimai** даёт всем партнёрам одинаковые преимущества и обязанности."
        question_7:
            question: "Может ли партнёр потерять свой статус?"
            answer: "Да. Статус может быть отозван — например, в случае предоставления ложных сведений, устойчивого снижения качества или поведения, противоречащего ожиданиям программы. Статус действует только до тех пор, пока партнёр сохраняет хорошую репутацию, и не является пожизненно приобретённым правом."
        question_8:
            question: "Как найти подходящего партнёра?"
            answer: |
                Есть два варианта:
                1. Откройте страницу **Найти партнёра**, выберите подходящего партнёра и свяжитесь с ним по указанным контактам.
                2. Если вы не уверены, какой партнёр подойдёт лучше всего, отправьте запрос с кратким описанием проекта на <partner@kimai.org>. Ваш запрос будет передан подходящим партнёрам, чтобы заинтересованные Официальные партнёры Kimai могли с вами связаться.
