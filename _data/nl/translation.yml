landing_oss:
    version_cloud: Binnen enkele seconden aan de slag, laat de hosting en update aan mij over, u zorgt voor uw core business. Zorg ervoor dat uw team klaar is voor de toekomst, met een moderne tijdsregistratieoplossing. Alle plug-ins zijn zonder extra kosten beschikbaar in de cloud.
    transparency_intro: Met closed-source-software heeft u alleen de verzekering van de leverancier dat de software veilig is en aan de standaarden voldoet. De zichtbaarheid van de code van open-source software betekent dat u het zelf kunt zien. U kunt altijd mijn reacties aan de community zien, het releaseschema en de mijlpalen, en elke commit- en pull-aanvraag.
    version_choose: Welke Kimai past bij u?
    vendor_title: Geen vendor lock-in
    vendor_intro: Vendor lock-in kan veel kosten, niet alleen in contanten, maar ook in uren. Met Kimai kan u zelf hosten, het door mij laten hosten, of de software afsplitsen en wijzigen. U zit nooit vast aan een gehost product en al uw gegevens zijn eenvoudig te exporteren, zodat als u ooit besluit dat Kimai niet meer voor u is, uw gegevens nog steeds van u zijn (hetzelfde geldt voor de betaalde abonnementen, ik bied aan gegevens te exporteren bij annulering).
    transparency_title: Altijd transparant
