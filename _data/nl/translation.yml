about:
    name: 'Over Kimai'
    subtitle: Wat begon als een hobbyproject is nu de toonaangevende open-source tijdsregistratiesoftware ter wereld. Laten we de geschiedenis induiken.
    description: 'Lees meer over de geschiedenis van de tijdsregistratietool Kimai en de ontwikkelaar ervan.'
    collaboration:
        title: Samenwerking
        content: Klanten waarderen het gemak van gratis ondersteuning en de uitwisseling is een essentieel onderdeel van mijn werk. Ik ben dol op de betrokkenheid van de community op GitHub, de samenwerking en het agile werken. De voortdurende verbetering op basis van jullie feedback maakt deze reis tot een buitengewone ervaring.
    technology:
        title: Technologie
        content: Als ontwikkelaar hou ik ervan om nieuwe technologieën uit te proberen. En als dit de manier verbetert waarop u met Kimai omgaat, zou ik het een win-winsituatie noemen. UI en UX zijn voor mij cruciaal, want software moet eenvoudig te gebruiken zijn. Veiligheid is een standaardvereiste en open-source software is een belangrijke succesfactor voor veel bedrijven.
    joy:
        title: Plezier in het werk
        content: De ontwikkeling van Kimai is de ideale combinatie van het beroep dat ik liefheb, met zijn oneindige mogelijkheden om door te leren, en de noodzaak om geld te verdienen om mijn gezin te ondersteunen. Dankzij Kimai kan ik meer tijd doorbrengen met mijn vrouw en kind, wat waarschijnlijk de beste motivatie is die ik mij kan voorstellen.
    kevin: Kimai en de Cloud worden ontwikkeld en beheerd door Kevin, een onafhankelijke softwareontwikkelaar uit Wenen (Oostenrijk).
