industries:
    name: Sectoren
    agency:
        features:
            introduction: Niet alle tijdsregistratietools zijn gelijk. De beste oplossingen voor bureaus bieden een gespecialiseerde set functies om uw workflows te stroomlijnen.
            title: Kimai-functies die het meest door bureaus worden gebruikt
        testimonials:
            tag: Bureau
            introduction: Bij Kimai hebben we ons tijdsregistratieplatform ontworpen om aan de behoeften van bureaus, teams en zelfstandigen te voldoen. Onze intuïtieve interface en krachtige functies helpen bureaus zoals het uwe slimmer en winstgevender te werken. U kunt nu "luisteren" naar de ervaringen van echte gebruikers.
            title: Wat bureaus zeggen over tijdsregistratie
        about:
            title: Eerste stappen naar betere tijdsregistratie
            introduction: |
                U heeft uw eerste stappen al gezet en we zijn ervan overtuigd dat u een weloverwogen keuze kunt maken. Wat moet u nog meer overwegen om de beste tijdsregistratiesoftware te kiezen? Sommige aanbieders bieden gratis versies aan, die beperkingen kunnen hebben, terwijl andere gratis demo’s, proefperiodes of prijsmodellen aanbieden op basis van de bedrijfsomvang of het aantal gebruikers.

                Bij Kimai bieden we een gratis proefperiode aan zodat u onze oplossing kunt verkennen voordat u beslist of u extra gebruikers, functies of plug-ins nodig heeft. Probeer het vandaag gratis en heb een meer georganiseerde werkdag!
        title: Tijdsregistratie voor Bureaus
        cta:
            title: |
                Klaar om te starten
                met tijdsregistratie in uw bureau?
        name: Bureaus
        introduction: |
            Runt u een bureau — of het nu in marketing, PR, design, consultancy, HR of architectuur is? Dan weet u hoe cruciaal tijdsregistratie is voor een bedrijf: het bijhouden van de uren van medewerkers en de tijd die aan klantprojecten wordt besteed, is essentieel om correct te factureren, de winstgevendheid te begrijpen en uw groeiende team te beheren.

            Maar tijdsregistratie beheren via spreadsheets en losse tools kan al snel een chaos worden, vooral wanneer uw bureau groeit. Dan kan een speciale tijdsregistratieoplossing het verschil maken.

            Laten we kijken waarom succesvolle bureaus op tijdsregistratiesoftware vertrouwen en welke essentiële functies u moet zoeken. We gebruiken Kimai als voorbeeld van een gebruiksvriendelijke oplossing die met bureaus in gedachten is gebouwd.
        intro: Benut het winstpotentieel in snelgroeiende bureaus met een schaalbaar tijdsregistratiesysteem
        subtitle: De sleutel tot winstgevendheid
    lawyer:
        about:
            title: Eerste stappen naar betere tijdsregistratie in uw advocatenpraktijk
            introduction: |
                We begrijpen dat het uitproberen van nieuwe software in de juridische sector ontmoedigend kan voelen. Daarom bieden we een gratis proefperiode zonder verplichtingen, een eenvoudige onboarding, een flexibele set functies die meegroeit met uw praktijk of team, en speciale ondersteuning.

                We geloven dat u zelfs tijdens een gratis proefperiode een manier kunt vinden om te stoppen met worstelen met tijdroosters. Probeer Kimai vandaag en heb een fijne, georganiseerde dag!
        features:
            title: Kimai-functies die advocatenkantoren waarderen
            introduction: Kimai is speciaal ontworpen met juridische professionals in gedachten. We hebben een tijdsregistratietool gemaakt die uw taal spreekt — eenvoudig, betrouwbaar, AVG-conform en gericht op een soepelere werkdag.
        testimonials:
            introduction: Bij Kimai zijn juridische professionals en consultants altijd ons aandachtspunt geweest. Lees nu over de echte ervaring van onze gebruikers.
            title: Inzichten over tijdsregistratie van onze klanten
        title: Tijdsregistratie voor advocaten
        intro: Laat complexe tijdroosters achter u en richt uzelf op uitmuntende juridische dienstverlening met moderne tijdsregistratieoplossingen
        subtitle: Focus op factureerbare uren, niet op ingewikkelde tijdroosters
        name: Advocaten
        introduction: |
            In de snelle wereld van juridische dienstverlening is tijd het waardevolste bezit. Advocatenkantoren, zelfstandige advocaten en juridische teams hebben een tijdsregistratieoplossing nodig die is afgestemd op de unieke eisen van hun vak. Bij Kimai begrijpen we dat uw focus moet liggen op uitmuntende juridische dienstverlening — niet op het worstelen met ingewikkelde tijdroosters.

            Handmatig uren bijhouden, eindeloze spreadsheets en omslachtige exportprocessen kosten waardevolle tijd die u beter aan uw juridische advies kunt besteden. Ontdek hoe efficiënte tijdsregistratie u helpt om u te richten op wat er echt toe doet.
        cta:
            title: |
                Klaar voor de revolutie
                voor tijdsregistratie in uw praktijk?
    software-developers:
        features:
            title: Kimai-functies die door software-engineers worden gebruikt
            introduction: Ontdek de perfecte set functies, afgestemd op uw taken en doelen. Wat als uw IT-team niet alleen een eenvoudige tijdsregistratie nodig heeft, maar een robuuste oplossing met verschillende integratieopties en geavanceerde facturatie- en analysemogelijkheden?
        title: Tijdsregistratie voor softwareontwikkelaars
        about:
            introduction: |
                De juiste tijdsregistratie kiezen begint vaak met de keuze tussen een gratis versie of een demo. De prijs is ook een belangrijke factor, dus zoek naar opties die meegroeien met uw team.

                Bij Kimai bieden we een gratis proefperiode aan zodat u onze oplossing kunt verkennen voordat u beslist of u extra functies of plug-ins nodig hebt. Met prijzen vanaf slechts € 0,99 per gebruiker voor sommige sectoren is het een betaalbare keuze. Probeer het vandaag gratis en breng meer structuur in je werkdag!
            title: Eerste stappen naar betere tijdsregistratie
        subtitle: Maximaliseer Uw Productiviteit
        cta:
            title: |
                Klaar om een nieuwe manier te proberen
                om tijd te registreren in uw IT-team?
        testimonials:
            title: IT-professionals over tijdsregistratie
            introduction: Bij Kimai hebben we ons tijdsregistratieplatform ontworpen met de behoeften van individuele ontwikkelaars, devteams en IT-afdelingen in gedachten. Onze aanpak is gericht op het bouwen van open-sourceoplossingen voor techteams van elke omvang en in verschillende sectoren. U kunt zien wat voor feedback we ontvangen van onze gebruikers uit de tech.
        name: Softwareontwikkelaars
        intro: Maximaliseer de productiviteit van het team en bereik een goede werk-privébalans met slimme tijdsregistratie
        introduction: |
            We kennen de pijn maar al te goed — eindeloos overwerk, stressvolle deadlines, tijdrovende bugs en de voortdurende strijd om projectmanagers en klanten de echte inspanning achter uw code te laten waarderen. Het is een vicieuze cirkel die snel kan leiden tot burn-out en een verstoorde werk-privébalans. Dit is een veelvoorkomende uitdaging voor softwareontwikkelaars, programmeurs, engineers en andere tech-professionals.

            Maar er is een manier om uit deze cirkel te breken en uw tijd en taken weer in eigen hand te nemen. Met de juiste tools kunt u uw productiviteit maximaliseren en waardevolle inzichten in uw projecten krijgen. Of u nu freelance programmeur bent, deel uitmaakt van een start-up-team of een hele IT-afdeling leidt, een schaalbare oplossing met de juiste functies vinden is essentieel. Laten we Kimai bekijken — gebruiksvriendelijke en krachtige tijdsregistratiesoftware — als voorbeeld.
    consultants:
        features:
            title: Kimai-functies die het meest door consultants worden gebruikt
            introduction: Of u nu een zelfstandige bent of deel uitmaakt van een grote consultancyafdeling, Kimai biedt tools om mee te schalen terwijl je bedrijf groeit.
        about:
            title: Eerste stappen naar betere tijdsregistratie in consultancy
            introduction: |
                Om het meeste uit uw tijdsregistratiesoftware te halen, begint u met het verkennen van alle functies via een demo of gratis proefperiode. Als consultant wilt u waarschijnlijk de prijsopties zorgvuldig afwegen en vooruitdenken over welke functies u nodig kan hebben naarmate uw bedrijf groeit.

                Bij Kimai begrijpen we deze reis. Daarom bieden we een gratis proefperiode aan waarmee u onze oplossing kunt testen voordat u beslist welke extra functies of plug-ins het best bij u passen. Onze alles-in-één app groeit mee met uw bedrijf — u kunt eenvoudig uitbreidingen toevoegen wanneer dat nodig is. Probeer het vandaag gratis en heb een fijne, georganiseerde dag!
        subtitle: Maximaliseer factureerbare uren en efficiëntie
        name: Consultants
        title: Tijdsregistratie Voor Consultants
        testimonials:
            introduction: Bij Kimai hebben we ons platform gebouwd om zowel individuele consultants als grote teams te bedienen. Als alles-in-één oplossing wordt Kimai vertrouwd door bedrijven van elke omvang in verschillende sectoren. Dit is wat onze gebruikers uit de consultancybranche te zeggen hebben.
            title: Inzichten over tijdsregistratie van consultancyprofessionals
        intro: Verhoog de winstgevendheid en lever meer waarde aan klanten met strategische tijdsregistratie voor uitmuntende consultancy
        introduction: |
            In het dynamische consultancylandschap van vandaag — of het nu gaat om managementconsultancy, financieel advies, IT-diensten, data science, juridisch advies, psychologische dienstverlening of HR-consultancy — blijft één waarheid constant: tijd is het waardevolste bezit. Nauwkeurige tijdsregistratie gaat niet alleen over het bijhouden van uren. Het gaat erom de winstgevendheid te maximaliseren en waarde te leveren aan uw klanten.

            Laten we eerlijk zijn — consultancyprojecten beheren is niet makkelijk. Uw teamleden werken misschien tegelijkertijd vanuit New York, Londen en Singapore. Dat is veel om bij te houden! Bovendien moet u precies weten wie aan wat heeft gewerkt om uw klanten correct te factureren. Zonder goede tijdsregistratie kan het snel rommelig worden. U moet de projectkosten beheersen, voldoen aan regelgeving en ervoor zorgen dat de tijd van het team verstandig wordt benut.

            Daarom zijn alles-in-één tijdsregistratietools onmisbaar geworden voor consultants. Ze veranderen al die mogelijke chaos in heldere, georganiseerde gegevens die uw bedrijf tot bloei laten komen. Laten we kijken hoe een complete oplossing zoals Kimai uw consultancybedrijf kan transformeren.
        cta:
            title: |
                Klaar om een nieuwe manier te proberen
                om tijd te registreren in uw praktijk?
    freelancers:
        name: Freelancer
        testimonials:
            introduction: "Geloof ons niet op ons woord. Dit is wat andere freelancers zeggen:"
            title: Wat andere professionals delen over tijdsregistratie met Kimai
        features:
            title: 'Functies geliefd door freelancers'
            introduction: Kimai is ontworpen om solopreneurs te helpen hun workflow te stroomlijnen. Of u nu meerdere klanten jongleert of verschillende projecten beheert, Kimai biedt de tools die u nodig heeft om georganiseerd en winstgevend te blijven.
        introduction: |
            Wanneer freelancen een nieuw hoofdstuk in uw leven is, moet u nieuwe rollen op u nemen en nieuwe uitdagingen aangaan. Eén daarvan is time-management om de balans tussen de uren die u werkt en de winstgevendheid van uw projecten te vinden. Het beheren van meerdere projecten vraagt om analyse — zowel voor u als voor uw klanten.

            Maar er zijn tools die freelancers, opdrachtnemers, digital nomads en solo-eigenaars helpen om hun factureerbare uren bij te houden, klanten te factureren zonder hoofdpijn, uurtarieven en kosten te beheren, enzovoort.

            Daardoor kunt u zich richten op dat waarvan u houdt — en krijgt betaald wat u echt verdient. Laten we kijken hoe dat kan met Kimai als tijdsregistratietool voor freelancers.
        cta:
            title: |
                Klaar om het meeste te krijgen
                uit uw tijd als freelancer?
        title: Tijdsregistratie voor succesvolle freelancers
        about:
            title: Eerste stappen naar beter timemanagement
            introduction: |
                Klaar om de voordelen van Kimai te ervaren? We bieden een gratis proefperiode aan zodat u alle functies kunt verkennen voordat u beslist welke tijdsregistratiesoftware het beste bij u past als zelfstandige professional.

                Meld je vandaag aan, begin letterlijk met één klik met het bijhouden van uw tijd te registreren en heb een meer georganiseerde dag!
        intro: Vergeet nooit meer uw betaalbare uren, schrijf eenvoudigweg facturen en maximaliseer je inkomen als solopreneur
    universities:
        cta:
            title: |
                Klaar voor de transformatie
                van tijdsbepaling in uw instituut?
        subtitle: 'Focus op rapportage, geen moeilijke administratieve workflows'
        testimonials:
            introduction: |
                Bij Kimai hebben we ons tijdsregistratieplatform ontworpen om aan de behoeften van bureaus, teams en freelancers te voldoen.
                Onze intuïtieve interface en krachtige functies helpen bureaus zoals het uweslimmer en winstgevender te werken.
                U kunt nu "luisteren" naar de ervaringen van echte gebruikers.
            title: Wat onze klanten zeggen
        name: Universiteiten
        introduction: |
            Het beheren van tijd in het hoger onderwijs brengt unieke uitdagingen met zich mee, zoals het plannen van colleges en lessen, het volgen van onderzoeksprojecten, het toewijzen van tijd aan studenten en docenten, en tijdrovende administratieve taken.

            Effectieve tijdsregistratieoplossingen helpen deze processen te stroomlijnen, zodat docenten en onderzoekers zich op hun kerntaken kunnen richten.
        features:
            title: Functies voor instellingsbreed timemanagement
            introduction: |
                Onze tijdsregistratieoplossing is verfijnd in samenwerking met meerdere universiteiten. Echte gebruikersfeedback stuurt onze ontwikkeling aan en zorgt voor functies die echt aansluiten op academische behoeften.

                Een paar van de academische instellingen die Kimai gebruiken: `Universität Hamburg`, `Universität Bonn`, `Universität Wien`, `Universität Stuttgart`, `Universität Frankfurt`, `University of Fribourg`, `TU Dresden` en de `University of Moscow`.
        about:
            title: Begin uw reis naar beter time-management
            introduction: |
                We begrijpen dat het implementeren van een nieuw tijdsregistratiesysteem in een academische omgeving zorgvuldig overwegen vraagt.
                Daarom bieden we een gratis proefperiode en demosessies aan.
                Probeer Kimai nu gratis en heb een meer georganiseerde dag!
        intro: Transformeer de efficiëntie van uw instelling met krachtige tijdsregistratie
        title: Tijdsregistratie voor de academische sector
    non-profit:
        about:
            introduction: |
                Als u een organizatie zonder winstoogmerk vertegenwoordigt, registreer dan alstublieft met een officieel
                e-mail adres van uw organizatie en stuur ons een kort ondersteunend bericht. Uw abonnement zal worden geactiveerd na handmatige beoordeling.

                In ruil vragen wij een testimonial met uw logo en naam, of een interview waarmee wij u kunnen uitlichten als gebruiker.
            title: Ons betaalbare non-profit abonnement voor u
        introduction: |
            Vandaag bedanken wij de vele NGOs en NPOs:

            - Goede doelen en filantropische organisaties
            - Openbare en onafhankelijke scholen, universiteiten, gemeenschapsscholen
            - Bureaus voor openbare veiligheid, nooddiensten, noodhulp, brandweerposten, burgerbescherming
            - Natuurbehoud, sport, en alle andere clubs die gemeenschap vormen en vaardigheden overbrengen
            - Sociale dienste, ouderenzorg en jeugdzorgfaciliteiten
            - … en vele, vele anderen die we niet hebben kunnen noemen

            U geeft uw tijd, maakt kleine en grote wonderen en verrijkt de levens van vele: **Dank u dat u er bent❤️**

            Als een organisatie groeit, donaties toenemen en de eerste medewerkers aangenomen worden ontstaat de noodzaak om gestructureerd tijd te registreren. Het transparant documenteren van workflows helpt kansen voor verbetering vroeg zien – waardoor u uw tijd en geld weer in uw missie kan steken op de basis van transparante verantwoordingsrapporten.
        subtitle: Minder administratieve rompslomp zodat uw missie scherp blijft
        cta:
            title: |
                Wij willen u helpen
                om uw tijdsregistratie te vereenvoudigen
        title: Tijdsregistratie voor Organisaties zonder Winstoogmerk✨
        features:
            title: Functies die NPOs waarderen
            introduction: Kimai helpt vele non-profits om inzicht te krijgen in hun projecten en het vereenvoudigt het beheren van werktijden. We hebben een tijdsregistratietool gebouwd die uw taal spreekt – simpel, betrouwbaar, AVG-conform, en ontworpen om uw dagelijks werk soepeler te laten lopen.
        testimonials:
            title: Wat andere NPOs zeggen over Kimai
            introduction: |
                Met dank aan de open-source roots van Kimai zien wij onszelf als onderdeel van de bredere non-profit beweging die over zo veel velden en sectoren is uitgestrekt.
                We zijn blij om u te mogen ondersteunen!
        intro: Wij zetten uw werk en visie centraal terwijl administratie en facturatie vereenvoudigd worden
        name: Non-Profits
