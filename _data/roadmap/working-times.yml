    id: 155
    number: 155
    slug: global-company-vacation-days-mandatory-vacation-days
    title: 'Global Company Vacation Days (Mandatory Vacation Days)'
    status: open
    votesCount: 3
    description: |-
      **Description**\
      It would be very helpful to have a feature that allows the organization to define global company vacation days (company shutdown days).\
      Functionally, this would work similarly to manually creating public holidays, with one key difference:\
      these days would automatically deduct one vacation day from each user.

      **Proposed Implementation**\
      This could be integrated into the existing holiday management screen.\
      If the WorkContractPlugin is installed, an additional toggle could be displayed that marks a holiday as a mandatory vacation day (i.e., a day that counts against the user's annual leave entitlement).

      **Use Case**\
      Organizations that have fixed company-wide shutdown periods (e.g., between Christmas and New Year) could define these days once, ensuring consistent handling across all employees without requiring manual vacation entries.

      **Benefits**

      - Ensures consistent and automated deduction of vacation days
      - Reduces administrative overhead
      - Integrates naturally with existing holiday configuration

      ---

