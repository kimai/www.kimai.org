    slug: working-times-plugin-add-possibility-to-run-dedicated-working-time-project-just-once-at-a-time
    title: 'Working times plugin: add possibility to run dedicated working time project just once at a time'
    status: open
    votesCount: 2
    description: |-
      We would do presence time tracking ("working time") and billable work time tracking (project or support work for our customers) in parallel.
      Therefore we would select a dedicated project in the plugin settings for tracking our employees' presence time.
      We also set Kimai's permitted number of simultaneously running time entries to 2, such that we are able to run the project to track working time and additionally we can count time in other Kimai projects, which we can bill to our customers.

      However, in such a configuration one can run the working time tracking accidentially twice.
      If a dedicated project is selected for tracking the working time, would it be possible to allow to limit it to run just once at a time?

