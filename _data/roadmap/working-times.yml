    id: 203
    number: 203
    slug: break-times-manual-and-automatic
    title: 'Break times (manual and automatic)'
    status: planned
    votesCount: 8
    description: |-
      ## Manually

      Our employees are required to record exact start and end time of their breaks, but this feature does not exist in Kimai. Instead, we have to stop the timer, go on break, and then start the timer again

      ### Describe the solution you'd like

      Best thing would be to have a "Pause" Button on top, to just pause timetracking and then press continue, just like a Musicplayer, and Kimai would calculate the time minus break and show breaktime length.

      ---

      ## Automatically

      Currently, breaks must always be entered manually (either via the break field or as a separate entry).  
      For companies with fixed legal or internal break policies (e.g., German Arbeitszeitgesetz), this creates unnecessary manual overhead and compliance risks, as entries often end up without any recorded break.

      ### Describe the solution you'd like

      In Germany, a 6h bis 9h working time requires at least 30 Min of break time; for 9h it's 45 Min. It would be great to save this requirements in the setting and have it applied by default

      - If daily worked time exceeds X hours, automatically deduct Y minutes.
      - Example: > 6 hours -> 30 min deduction; > 9 hours -> 45 min deduction.
      - Configurable globally (System settings) with possible overrides.
      - The deduction should be applied automatically upon stopping the time entry or saving the day, ensuring correct net duration without manual input.

      ---

      ## Loose ideas

      - Breaks (Pause)
        - Support calculation of breaks (e.g. display in calendar)
        - Use all breaks between first entry of the day and last entry of the day as pause
      - Working time requirements (Arbeitszeitvorgaben)
        - Maximum working time (per day, in one session) and breaks
        - Configure fixed rules per country
        - Allow one custom rule
        - Configure default rule (country or custom) per user
