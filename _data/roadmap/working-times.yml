    slug: monthly-and-yearly-employee-reports-work-time-balance-leave-overview
    title: 'Monthly & Yearly Employee Reports (Work Time, Balance, Leave Overview)'
    status: open
    votesCount: 6
    description: |-
      Description  
      It would be highly valuable to have monthly and yearly reports for each employee that consolidate all relevant working‑time and absence information in one place.
      The report should present:

      Total working days within the selected period

      Recorded working hours, ideally broken down by project (similar to the existing time‑tracking export)

      Expected working hours for the period

      Resulting time balance (difference between expected and actual hours)

      Additionally, the report should include an overview of all absence types during the same period:

      Vacation days taken

      Public holidays

      Sick days

      Other types of leave

      Remaining vacation balance

      Proposed Implementation  
      A combined table or report view that lists projects and working hours, and in parallel displays the absence days and remaining vacation.
      A practical approach could be to extend or reuse the existing “Time Tracking / Export” functionality as a template, since it already provides a structured breakdown by project and period. Enhancing this module with absence data, expected hours, and balances would create a unified reporting tool without duplicating logic.

      Use Case  
      Organizations often need consolidated overviews for payroll, HR processes, or employee self-service.
      Employees also benefit from a clear summary of their working hours, balances, and leave usage.

      Benefits

      Centralized overview of all relevant time and absence data

      Reduces manual calculations and cross-checking

      Supports HR, payroll, and employee transparency

      Builds on existing reporting structures (project breakdown, time tracking)

      Minimizes development effort by extending an existing export module

      ---

