    id: 143
    number: 143
    slug: add-an-option-to-not-count-activities-as-working-time-dashboard-and-workingcontract
    title: 'Add an option to not count activities as working time (Dashboard and WorkingContract)'
    status: open
    votesCount: 2
    description: |-
      ### Describe the problem

      There are cases where you do not want an activity to be counted as working time (both in Kimai itself and in the WorkingContract plugin). This is, for example, on-call duty. If you are on call over a weekend (Fri. 6:00 p.m. to Mon. 8:00 a.m.), this on-call time is 62 hours in Kimai. However, this is not actual working time and if you could simply tell the “on-call” activity that it is not counted, the calculation would add up again. As a result, we have employees who do not have correct time recording in Kimai and who also cannot use WorkingContract (e.g. I have 320 hours of overtime since the beginning of the year because of this). Of course, we can't simply leave out the on-call entries in Kimai, as these have to be charged to the customer.

      ### Describe the solution you'd like

      Adding an option to the activities so that they do not count as working hours (Kimai itself and WorkingContract).

      ### Describe alternatives you've considered

      _No response_

      ### Screenshots

      _No response_

