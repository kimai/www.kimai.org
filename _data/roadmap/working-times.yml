    id: 134
    number: 134
    slug: using-a-project-for-attendance-tracking-leads-to-duplicated-hours
    title: 'Using a project for attendance tracking leads to duplicated hours'
    status: planned
    votesCount: 2
    description: |-
      With version 1.20.0 of the WorkContract there is a new `System > Setting`

      When this setting is active, only times booked on the project will be calculated as working time.

      Problem: all widgets and reports will still include that attendance time and therefor sum up "attendance" and "project working time".

      Solution: the "attendance only" project should be filtered out of all reports and widgets.

      ---

