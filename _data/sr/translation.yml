            security_2: 'Najbolje prakse bezbednosti, firewall-ovi i zaštita od brute-force napada'
            security_3: 'Bez deljenog zakupa, svaki klijent ima sopstvenu bazu podataka'
            security_4: 'Serveri se nalaze u data centru u EU'
            security_5: 'Kritični servisi nisu dostupni spoljnom svetu'
