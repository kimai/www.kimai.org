    agency:
        name: 'Agencije'
        title: "Evidentiranje vremena za agencije"
        subtitle: "Ključ profitabilnosti"
        intro: "Otključaj potencijal profitabilnosti u agencijama koje brzo rastu uz skalabilan sistem za evidentiranje vremena"
        introduction: |
            Vodiš agenciju – bilo da se radi o marketingu, odnosima sa javnošću, dizajnu, konsaltingu, ljudskim resursima ili arhitekturi? Onda znaš koliko je evidentiranje vremena ključno za tvoje poslovanje. Praćenje radnih sati zaposlenih i vremena utrošenog na projekte klijenata neophodno je za tačno fakturisanje, razumevanje profitabilnosti i upravljanje timom koji raste.

            Ali upravljanje evidentiranjem vremena putem tabela i nepovezanih alata brzo može postati haotično, posebno kako tvoja agencija raste. Tu namensko rešenje za evidentiranje vremena može biti prava prekretnica.

            Hajde da istražimo zašto se uspešne agencije oslanjaju na softver za evidentiranje vremena i koje su ključne funkcije na koje treba obratiti pažnju. Kao primer ćemo koristiti Kimai – rešenje jednostavno za korišćenje, napravljeno imajući u vidu potrebe agencija.
        features:
            title: "Kimai funkcije koje agencije najviše koriste"
            introduction: "Nisu svi alati za evidentiranje vremena isti. Najbolja rešenja za agencije nude specijalizovan skup funkcija za pojednostavljivanje radnih tokova."
        testimonials:
            tag: 'Agencija'
            title: "Šta agencije kažu o evidentiranju vremena"
            introduction: 'U Kimai-ju smo osmislili našu platformu za evidentiranje vremena tako da odgovara potrebama agencija, timova i frilensera. Naš intuitivni interfejs i moćne funkcije pomažu agencijama poput tvoje da rade pametnije i profitabilnije. Sada možeš da "poslušaš" recenzije stvarnih korisnika.'
        about:
            title: "Prvi koraci ka boljem evidentiranju vremena"
            introduction: |
                Već si napravio/la prve korake i sigurni smo da možeš doneti informisanu odluku. Šta bi još trebalo da uzmeš u obzir prilikom izbora najboljeg softvera za evidentiranje vremena? Neki dobavljači rešenja nude besplatne verzije koje mogu imati ograničenja, dok drugi nude besplatne demo verzije, probne periode ili cene koje zavise od veličine kompanije ili broja korisnika.

                U Kimai-ju nudimo besplatan probni period kako bi mogao/la da istražiš naše rešenje pre nego što odlučiš da li su ti potrebni dodatni korisnici, funkcije ili dodaci. Isprobaj ga besplatno već danas i uvedi više reda u svoj radni dan!
        cta:
            title: |
                Jesi li spreman/na
                da počneš evidentirati vreme u svojoj agenciji?
    consultants:
        name: 'Konsultanti'
        title: "Evidentiranje vremena za konsultante"
        subtitle: "Maksimizuj naplative sate i efikasnost"
        intro: "Povećaj profitabilnost i vrednost za klijente strateškim evidentiranjem vremena za vrhunske konsultantske usluge"
        introduction: |
            U današnjem dinamičnom okruženju konsaltinga, bilo da se radi o menadžment konsaltingu, finansijskom savetovanju, IT uslugama, nauci o podacima, pravnom savetovanju, psihološkim uslugama ili konsaltingu za ljudske resurse – jedna istina ostaje konstantna: vreme je tvoj najvredniji resurs. Precizno evidentiranje vremena nije samo beleženje sati. Radi se o maksimizaciji profitabilnosti i pružanju vrednosti tvojim klijentima.

            Budimo iskreni – upravljanje konsultantskim projektima nije lako. Članovi tima mogu istovremeno raditi iz Njujorka, Londona i Singapura. To je mnogo toga za praćenje! Osim toga, potrebno je tačno znati ko je radio na čemu kako bi se klijentima ispravno fakturisalo. Bez pravilnog evidentiranja vremena, stvari brzo mogu postati haotične. Potrebno je kontrolisati troškove projekata, ostati usklađen sa propisima i osigurati da se vreme tima koristi na najbolji mogući način.

            Zato su sveobuhvatni alati za evidentiranje vremena postali neophodni za konsultante. Oni pretvaraju sav taj potencijalni haos u jasne, organizovane podatke koji pomažu tvom poslovanju da napreduje. Hajde da istražimo kako sveobuhvatno rešenje poput Kimaia može da transformiše tvoje konsultantsko poslovanje.
        features:
            title: "Kimai funkcije koje konsultanti najviše koriste"
            introduction: "Bilo da si frilenser ili deo velikog konsultantskog odeljenja, Kimai nudi alate koji ti pomažu da rasteš zajedno sa svojim poslovanjem."
        testimonials:
            title: "Uvidi o evidentiranju vremena od konsultantskih profesionalaca"
            introduction: 'U Kimai-ju smo napravili našu platformu tako da odgovara potrebama pojedinačnih konsultanata, kao i velikih timova. Kao sveobuhvatno rešenje, Kimaiu veruju kompanije svih veličina u raznim sektorima. Evo šta kažu naši korisnici iz oblasti konsaltinga.'
        about:
            title: "Prvi koraci ka boljem evidentiranju vremena u konsaltingu"
            introduction: |
                Da bi izvukao/la najviše iz svog softvera za evidentiranje vremena, počni istraživanjem svih funkcija kroz demo verziju ili besplatan probni period. Kao konsultant, verovatno ćeš želeti pažljivo da razmotriš opcije cena i unapred razmisliš o tome koje bi ti dodatne funkcije mogle biti potrebne kako tvoje poslovanje raste.

                U Kimai-ju razumemo taj put. Zato nudimo besplatan probni period koji ti omogućava da isprobaš naše rešenje pre nego što odlučiš koje bi ti dodatne funkcije ili dodaci najbolje odgovarali. Naša sveobuhvatna aplikacija raste zajedno sa tvojim poslovanjem – jednostavno dodaj proširenja kad god ti zatrebaju. Isprobaj je besplatno već danas i uživaj u dobro organizovanom danu!
        cta:
            title: |
                Jesi li spreman/na da isprobaš novi način
                evidentiranja vremena u svojoj praksi?
    freelancers:
        name: 'Frilenser'
        title: "Evidentiranje vremena za uspešne frilensere"
        intro: "Nikada ne gubite pregled nad svojim naplativim satima, jednostavno izrađujte račune i povećajte svoje prihode kao samostalni preduzetnik"
        introduction: |
            Kada je frilensing novo poglavlje u tvom životu, moraš da isprobaš nove uloge i suočiš se sa novim izazovima. Jedan od njih je upravljanje vremenom i usklađivanje radnih sati sa profitabilnošću tvojih projekata. Balansiranje više projekata zahteva analizu, kako za tebe tako i za tvoje klijente.

            Ali postoje alati koji pomažu frilenserima, ugovornim saradnicima, digitalnim nomadima i samostalnim preduzetnicima da prate svoje naplative sate, fakturišu klijentima bez stresa, upravljaju satnicama i troškovima itd.

            To ti omogućava da se fokusiraš na ono što voliš – i da budeš plaćen/a onoliko koliko zaista zaslužuješ. Pogledajmo kako to postići uz Kimai kao alat za evidentiranje vremena za frilensere.
        features:
            title: "Funkcije koje frilenseri vole"
            introduction: "Kimai je osmišljen da pomogne samostalnim preduzetnicima da pojednostave svoj radni tok. Bilo da žongliraš sa više klijenata ili upravljaš raznim projektima, Kimai pruža alate koji su ti potrebni da ostaneš organizovan/a i profitabilan/na."
        testimonials:
            title: "Šta drugi profesionalci kažu o evidentiranju vremena sa Kimaiem"
            introduction: "Nemoj samo nama da veruješ. Evo šta kažu drugi frilenseri:"
        about:
            title: "Prvi koraci ka boljem upravljanju vremenom"
            introduction: |
                Jesi li spreman/na da iskusiš prednosti Kimaia? Nudimo besplatan probni period kako bi mogao/la da istražiš sve funkcije pre nego što odlučiš koji je softver za evidentiranje vremena najbolji za tebe kao samostalnog profesionalca.

                Prijavi se već danas, počni da evidentiraš svoje vreme doslovno jednim klikom i uvedi više reda u svoj radni dan!
        cta:
            title: |
                Jesi li spreman/na
                da maksimalno iskoristiš svoje vreme kao frilenser?
    lawyer:
        name: 'Advokati'
        title: "Evidentiranje vremena za advokate"
        subtitle: "Fokusiraj se na naplative sate, a ne na komplikovane evidencije vremena"
        intro: "Reši se komplikovanih evidencija vremena i fokusiraj se na pružanje izuzetnih pravnih usluga uz moderna rešenja za evidentiranje vremena"
        introduction: |
            U brzom svetu pravnih usluga, vreme je tvoja najvrednija imovina. Advokatske kancelarije, samostalni advokati i pravni timovi trebaju rešenje za evidentiranje vremena prilagođeno jedinstvenim zahtevima njihove profesije. U Kimai-ju smatramo da bi tvoj fokus trebalo da bude pružanje vrhunskih pravnih usluga – a ne borba sa komplikovanim evidencijama radnog vremena.

            Ručno evidentiranje sati, beskrajne tabele i složeni procesi izvoza oduzimaju dragoceno vreme koje bi bolje bilo utrošeno na pružanje stručnog pravnog saveta. Otkrij kako efikasno evidentiranje vremena može da ti pomogne da se fokusiraš na ono što je zaista važno.
        features:
            title: "Kimai funkcije koje advokatske kancelarije vole"
            introduction: "Kimai je posebno dizajniran imajući u vidu pravne profesionalce. Napravili smo alat za evidentiranje vremena koji govori tvojim jezikom – jednostavan, pouzdan, u skladu sa GDPR-om i usmeren na to da ti radni dan učini lakšim."
        testimonials:
            title: "Uvidi o evidentiranju vremena od naših klijenata"
            introduction: 'U Kimai-ju su pravni profesionalci i konsultanti oduvek bili naš fokus. Sada možeš da pročitaš o stvarnom iskustvu naših korisnika.'
        about:
            title: "Prvi koraci ka boljem evidentiranju vremena u tvojoj advokatskoj praksi"
            introduction: |
                Razumemo da isprobavanje novog softvera u advokatskom poslu može delovati zastrašujuće. Zato nudimo besplatan probni period bez obaveza, jednostavno uvođenje, fleksibilan skup funkcija koje rastu zajedno sa tvojom kancelarijom ili timom, i posvećenu podršku.

                Verujemo da čak i tokom besplatnog probnog perioda možeš da isprobaš način da prestaneš da se boriš sa evidencijama radnog vremena. Isprobaj Kimai već danas i imaj lep, organizovan dan!
        cta:
            title: |
                Jesi li spreman/na
                za revoluciju u evidentiranju vremena u svojoj praksi?
    software-developers:
        name: 'Softverski programeri'
        title: "Evidentiranje vremena za softverske programere"
        subtitle: "Maksimizuj svoju produktivnost"
        intro: "Maksimizuj produktivnost tima i postigni ravnotežu između poslovnog i privatnog života uz pametno evidentiranje vremena"
        introduction: |
            Itekako dobro poznajemo te izazove – beskrajni prekovremeni sati, stresni rokovi, dugotrajni bagovi i stalna borba da projektni menadžeri i klijenti prepoznaju stvarni trud uložen u tvoj kod. To je začarani krug koji brzo može dovesti do sagorevanja (burnout-a) i narušiti ravnotežu između poslovnog i privatnog života. Ovo je čest izazov sa kojim se suočavaju softverski programeri, inženjeri i drugi IT profesionalci.

            Ali postoji način da se izbaviš iz tog kruga i ponovo preuzmeš kontrolu nad svojim vremenom i zadacima. Korišćenjem pravih alata možeš da povećaš svoju produktivnost i dobiješ vredne uvide u svoje projekte. Bilo da si frilens programer, deo startap tima ili upravljaš celim IT odeljenjem, pronalaženje skalabilnog rešenja sa pravim funkcijama je ključno. Hajde da istražimo Kimai – jednostavan, ali moćan softver za evidentiranje vremena – kao primer.
        features:
            title: "Kimai funkcije koje koriste softverski inženjeri"
            introduction: "Otkrij savršen skup funkcija prilagođenih tvojim zadacima i ciljevima. Šta ako tvom IT timu nije potreban samo jednostavan alat za evidentiranje vremena, već robusno rešenje sa različitim mogućnostima integracije i naprednim funkcijama za fakturisanje i analizu?"
        testimonials:
            title: "IT profesionalci govore o evidentiranju vremena"
            introduction: 'U Kimai-ju smo dizajnirali našu platformu za evidentiranje vremena imajući u vidu potrebe pojedinačnih programera, razvojnih timova i IT odeljenja. Naš pristup je usmeren na izgradnju rešenja otvorenog koda za tehnološke timove svih veličina i u različitim sektorima. Pogledaj kakve povratne informacije dobijamo od naših korisnika iz sveta tehnologije.'
        about:
            title: "Prvi koraci ka boljem evidentiranju vremena"
            introduction: |
                Biranje pravog alata za evidentiranje vremena često počinje odlukom između besplatne verzije ili demo verzije. Cena je takođe ključan faktor, zato traži opcije koje mogu da rastu zajedno sa tvojim timom.

                U Kimai-ju nudimo besplatan probni period kako bi mogao/la da istražiš naše rešenje pre nego što odlučiš da li su ti potrebne dodatne funkcije ili dodaci. Sa cenama koje počinju od samo 0,99 € po korisniku za neke delatnosti, reč je o pristupačnom izboru. Isprobaj ga besplatno već danas i unesi više organizacije u svoj radni dan!
        cta:
            title: |
                Jesi li spreman/na da isprobaš novi način
                evidentiranja vremena u svom IT timu?
    universities:
        name: 'Univerziteti'
        title: "Evidentiranje vremena za akademski sektor"
        subtitle: "Fokusiraj se na izveštavanje, a ne na komplikovane administrativne procese"
        intro: "Povećaj efikasnost svoje institucije uz moćno evidentiranje vremena"
        introduction: |
            Upravljanje vremenom u visokom obrazovanju donosi jedinstvene izazove, uključujući raspoređivanje predavanja i nastave, praćenje istraživačkih projekata, raspodelu vremena studentima i nastavnom osoblju, kao i dugotrajne administrativne zadatke.

            Efikasna rešenja za evidentiranje vremena mogu pomoći da se ovi procesi pojednostave, omogućavajući nastavnicima i istraživačima da se fokusiraju na svoje osnovne odgovornosti
        features:
            title: "Funkcije za upravljanje vremenom na nivou cele institucije"
            introduction: |
                Naše rešenje za evidentiranje vremena usavršeno je kroz saradnju sa više univerziteta. Stvarne povratne informacije korisnika pokreću naš razvoj, obezbeđujući funkcije koje zaista služe akademskim potrebama.

                Evo samo nekoliko akademskih institucija koje koriste Kimai: `Universität Hamburg`, `Universität Bonn`, `Universität Wien`, `Universität Stuttgart`, `Universität Frankfurt`, `University of Fribourg`, `TU Dresden` i `Univerzitet u Moskvi`.
        testimonials:
            title: "Šta kažu naši klijenti"
            introduction: |
                U Kimai-ju smo dizajnirali našu platformu za evidentiranje vremena kako bismo zadovoljili potrebe agencija, timova i frilensera.
                Naš intuitivni interfejs i moćne funkcije pomažu agencijama poput tvoje da rade pametnije i profitabilnije.
                Sada možeš da "poslušaš" recenzije stvarnih korisnika.
        about:
            title: "Započni svoj put ka boljem upravljanju vremenom"
            introduction: |
                Svesni smo da uvođenje novog sistema za evidentiranje vremena u akademskom okruženju zahteva pažljivo razmatranje.
                Zato nudimo besplatan probni period i demo sesije.
                Isprobaj Kimai besplatno već sada i imaj organizovaniji dan!
        cta:
            title: |
                Jesi li spreman/na
                da transformišeš upravljanje vremenom u svojoj instituciji?
    non-profit:
        name: 'Neprofitne organizacije'
        title: "Evidentiranje vremena za neprofitne organizacije ✨"
        subtitle: "Manje administrativnog opterećenja, tako da tvoja misija ostaje u fokusu"
        intro: "Stavljamo tvoj rad i viziju u centar pažnje, dok pojednostavljujemo administraciju i fakturisanje"
        introduction: |
            Danas se zahvaljujemo brojnim NVO i neprofitnim organizacijama:

            - Humanitarnim i filantropskim organizacijama
            - Javnim i nezavisnim školama, univerzitetima, zajedničkim koledžima
            - Agencijama za javnu bezbednost, hitnim službama, pomoći u katastrofama, vatrogasnim službama, civilnoj zaštiti
            - Organizacijama za zaštitu prirode, sportskim i svim drugim klubovima koji neguju zajednicu i uče veštinama
            - Socijalnim službama, brizi o starima i ustanovama za mlade
            - … i mnogim, mnogim drugima koje smo zaboravili da pomenemo

            Dajete svoje vreme, stvarate male i velike čuda, i obogaćujete živote mnogih: **hvala vam što postojite ❤️**

            Kako organizacija raste, donacije se povećavaju, a prvi zaposleni se pridružuju timu, postaje jasna potreba za strukturiranim evidentiranjem vremena. Transparentno dokumentovanje radnih procesa pomaže da se rano prepoznaju prilike za unapređenje – oslobađajući resurse za tvoju stvarnu misiju, dok se istovremeno postavljaju temelji za transparentne izveštaje o odgovornosti.
        features:
            title: "Funkcije koje neprofitne organizacije cene"
            introduction: "Kimai pomaže mnogim neprofitnim organizacijama da steknu uvid u svoje projekte, uz pojednostavljeno upravljanje radnim vremenom. Napravili smo alat za evidentiranje vremena koji govori vašim jezikom – jednostavan, pouzdan, u skladu sa GDPR-om, i osmišljen da vaš svakodnevni rad učini lakšim."
        testimonials:
            title: "Šta druge neprofitne organizacije kažu o Kimai-ju"
            introduction: |
                Zahvaljujući poreklu Kimaia u otvorenom kodu, sebe vidimo kao deo šireg neprofitnog pokreta koji obuhvata mnoge oblasti i sektore.
                Rado ćemo vas podržati!
        about:
            title: "Naš pristupačan plan za neprofitne organizacije"
            introduction: |
                Ako predstavljate neprofitnu organizaciju, registrujte se sa zvaničnom
                e-mail adresom vaše organizacije i pošaljite nam kratku poruku podršci. Plan će biti aktiviran nakon ručnog pregleda.

                Zauzvrat tražimo izjavu (testimonial) sa vašim logom i imenom, ili intervju kako bismo vas mogli predstaviti kao korisnika.
        cta:
            title: |
                Želimo da vam pomognemo
                da pojednostavite svoje evidentiranje vremena
