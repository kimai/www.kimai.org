about:
    name: 'O Kimai-ju'
    subtitle: "Ono što je počelo kao hobi projekat sada je vodeća svetska aplikacija otvorenog koda za evidentiranje vremena. Pogledajmo njegovu istoriju."
    description: 'Saznaj više o istoriji programa za evidentiranje vremena Kimai i njegovom programeru.'
    kevin: 'Kimai i Cloud razvija i njima upravlja Kevin, nezavisni programer iz Beča (Austrija).'
    collaboration:
        title: 'Saradnja'
        content: 'Korisnici cene pogodnost besplatne podrške, a razmena je bitan deo mog rada. Volim angažman zajednice na GitHubu, saradnju i agilan rad. Stalno unapređenje na osnovu vaših povratnih informacija čini ovo putovanje izuzetnim iskustvom.'
    technology:
        title: 'Tehnologija'
        content: 'Kao programer, volim da testiram nove tehnologije. A ako to poboljšava način na koji komuniciraš sa Kimaiem, nazvao bih to situacijom u kojoj svi dobijaju. Korisnički interfejs i korisničko iskustvo su mi ključni jer softver mora biti jednostavan za korišćenje. Bezbednost je osnovni zahtev, a softver otvorenog koda je važan faktor uspeha za mnoge kompanije.'
    joy:
        title: 'Radost u poslu'
        content: 'Razvoj Kimaia je idealna kombinacija struke koju volim, sa beskrajnim mogućnostima usavršavanja, i potrebe da zarađujem novac kako bih izdržavao svoju porodicu. Zahvaljujući Kimai-ju, mogu da provodim više vremena sa suprugom i detetom, što je verovatno najbolja motivacija koju možeš da zamisliš.'
