    lawyer:
        name: 'Адвокати'
        title: "Евидентирање времена за адвокате"
        subtitle: "Фокусирај се на наплативе сате, а не на компликоване евиденције времена"
        intro: "Реши се компликованих евиденција времена и фокусирај се на пружање изузетних правних услуга уз модерна решења за евидентирање времена"
        introduction: |
            У брзом свету правних услуга, време је твоја највреднија имовина. Адвокатске канцеларије, самостални адвокати и правни тимови требају решење за евидентирање времена прилагођено јединственим захтевима њихове професије. У Kimai-ју сматрамо да би твој фокус требало да буде пружање врхунских правних услуга — а не борба са компликованим евиденцијама радног времена.

            Ручно евидентирање сати, бескрајне табеле и сложени процеси извоза одузимају драгоцено време које би боље било утрошено на пружање стручног правног савета. Откриј како ефикасно евидентирање времена може да ти помогне да се фокусираш на оно што је заиста важно.
        features:
            title: "Kimai функције које адвокатске канцеларије воле"
            introduction: "Kimai је посебно дизајниран имајући у виду правне професионалце. Направили смо алат за евидентирање времена који говори твојим језиком – једноставан, поуздан, у складу са GDPR-ом и усмерен на то да ти радни дан учини лакшим."
        testimonials:
            title: "Увиди о евидентирању времена од наших клијената"
            introduction: 'У Kimai-ју су правни професионалци и консултанти одувек били наш фокус. Сада можеш да прочиташ о стварном искуству наших корисника.'
        about:
