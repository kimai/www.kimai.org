    vendor_intro: "Зависност од произвођача може много да кошта, не само у новцу већ и у времену. Са Kimai-jeм можеш сам/а да га хостујеш, да затражиш да га ја хостујем за тебе, или да направиш форк и измениш га. Никад ниси везан/а за хостовани производ, и све твоје податке лако можеш да извезеш, тако да ако икада одлучиш да Kimai више није за тебе, твоји подаци остају твоји (исто важи и за плаћене планове, нудим извоз података након отказивања)."
