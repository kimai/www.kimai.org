        description: "Kimai podržava razne spoljne provajdere identiteta i prijavu putem LDAP-a i SAML-a (kao što su Google Workspace, Azure AD ili Authentik). Opciono je moguća dvofaktorska autentifikacija putem TOTP tokena."
    reporting:
        name: "Izveštaji i analize"
        description: "Analiza evidentiranog vremena po korisnicima, klijentima, projektima, aktivnostima, oznakama, vremenskim periodima i mnogo toga."
    mobile-ready:
        name: "Prilagođeno za mobilne uređaje"
        description: "Raspored je potpuno responzivan, napravljen za korišćenje na desktopu i mobilnim uređajima. Svaki korisnik može da podesi koje kolone podataka će biti prikazane, npr. da bi se izbeglo horizontalno pomeranje na malim uređajima."
    plugins:
        name: "Dodaci"
        description: "Kimai je napravljen tako da može da se proširuje, a funkcije se mogu dodati pomoću dodataka. Programeri koji žele da ih naprave mogu da koriste mnoge tačke za proširenje."
    multi-user:
        name: "Više korisnika"
        description: "Kimai može da koristi bilo koji broj korisnika: svaka instalacija podržava neograničen broj korisnika sa različitim ulogama (vidi dozvole)."
    multi-language:
        name: "Više jezika"
        description: "Kimai se može lokalizovati na bilo koji jezik i već je preveden na više od 30 jezika."
    teams:
        name: "Timovi"
        description: "Timovi povezuju korisnike u logičke grupe, poput odeljenja. Ograniči pristup podacima dodeljivanjem klijenata i projekata svojim timovima."
    customers:
        name: "Klijenti"
        description: "Upravljaj svojim klijentima i podesi adresu, kontakte, državu, valutu, vidljivost (za arhiviranje) i mnoga druga polja."
    projects:
        name: "Projekti"
        description: "Upravljaj projektima za svakog klijenta sa brojem narudžbine, budžetom i vidljivošću (za arhiviranje)."
    activities:
        name: "Aktivnosti"
        description: "Aktivnosti se koriste za dodeljivanje jedinice rada unosima u evidencijama vremena. Upravljaj aktivnostima za svaki projekat sa brojem narudžbine, budžetom i vidljivošću (za arhiviranje) ili napravi globalne aktivnosti da bi sprečio/la dupliranje."
    invoices:
        name: "Fakturisanje"
        description: "Podesivi šabloni faktura, mogućnosti grupisanja unosa, podesivi brojevi faktura i više formata poput PDF i DOCX."
    export:
        name: "Izvoz podataka"
        description: "Podaci iz evidencije vremena mogu se izvesti i deliti u formatima XLSX, PDF, CSV i HTML. Izvezeni zapisi mogu se zaključati i zaštititi od daljih promena."
    expenses:
        name: "Troškovi"
        description: "Kupi dodatak i evidentiraj troškove na osnovu klijenta, projekta i aktivnosti – radi kategorizacije i uključivanja u tvoje fakture."
    2fa:
        name: "Dvofaktorska autentifikacija (2FA)"
        description: "Kimai podržava dvofaktorsku autentifikaciju sa TOTP tokenima: zaštiti svoje korisničke naloge već danas!"
    saml:
        name: ""
        description: "Prijavljuj i registruj korisnike putem SAML-a koristeći svog postojećeg SSO provajdera identiteta, kao što su Google Workspace, Authentik ili Azure Active Directory."
