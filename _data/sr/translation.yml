        description: "Softver je bezbedan onoliko koliko je bezbedan sistem na kom radi. Primenjujem višeslojni pristup zaštiti servera i mrežne infrastrukture. Korisnici na hostovanoj platformi zaštićeni su višestrukim slojevima zaštite."
        points:
