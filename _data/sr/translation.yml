        description: "Tvoj SaaS softver uvek ima ograničenja? Kimai nema. Plaćaš samo za broj aktivnih korisnika. Ne ograničavam te i ne naplaćujem neaktivne korisnike. Možeš da napraviš neograničen broj korisnika, klijenata, projekata, aktivnosti, evidencija vremena i mnogo toga."
    privacy:
        name: "Privatnost je na prvom mestu"
        description: "Poštujem tvoju privatnost i podatke, kao i privatnost i podatke tvojih korisnika. Ne, ovo nije još jedan dosadan uvod u politiku privatnosti – tako ja vodim ovaj posao. Ne prodajem podatke. Pridržavam se GDPR-a i odgovoriću na sva pitanja o uključenim podobrađivačima."
    security:
        name: "Bezbednost u Kimai-ju"
        description: "Kimai primenjuje najbolje prakse u dizajnu aplikacija kako bi sprečio uobičajene napade. Automatizovane bezbednosne kontrole su ključne za svaki radni tok razvoja softvera kako bi se smanjilo vreme od nastanka do otkrivanja greške. Ove provere se pokreću pri svakoj promeni koda, svaki put."
