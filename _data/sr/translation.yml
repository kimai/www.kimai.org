    universities:
        name: 'Универзитети'
        title: "Евидентирање времена за академски сектор"
        subtitle: "Фокусирај се на извештавање, а не на компликоване административне процесе"
        intro: "Повећај ефикасност своје институције уз моћно евидентирање времена"
        introduction: |
            Управљање временом у високом образовању доноси јединствене изазове, укључујући распоређивање предавања и наставе, праћење истраживачких пројеката, расподелу времена студентима и наставном особљу, као и дуготрајне административне задатке.

            Ефикасна решења за евидентирање времена могу помоћи да се ови процеси поједноставе, омогућавајући наставницима и истраживачима да се фокусирају на своје основне одговорности
        features:
