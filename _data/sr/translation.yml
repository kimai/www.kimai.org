        description: "Заборавио/ла си лозинку? Kimai ти помаже да је ресетујеш путем е-маила."
    customer-portal:
        name: "Портал за клијенте"
        description: "Дели статистику клијената и пројеката, као и евиденције времена, са било ким користећи тајни URL, опционо заштићен лозинком."
    dark-mode:
        name: "Тамни режим"
        description: "Јер свакој апликацији треба тамни режим, који помаже да се смањи напрезање очију увече или у тамном окружењу."
    no-limits:
        name: "Без ограничења"
        description: "Твој SaaS софтвер увек има ограничења? Kimai нема. Плаћаш само за број активних корисника. Не ограничавам те и не наплаћујем неактивне кориснике. Можеш да направиш неограничен број корисника, клијената, пројеката, активности, евиденција времена и много тога."
    privacy:
        name: "Приватност је на првом месту"
        description: "Поштујем твоју приватност и податке, као и приватност и податке твојих корисника. Не, ово није још један досадан увод у политику приватности – тако ја водим овај посао. Не продајем податке. Придржавам се ГДПР-а и одговорићу на сва питања о укљученим подобрађивачима."
    security:
        name: "Безбедност у Kimai-ју"
        description: "Kimai примењује најбоље праксе у дизајну апликација како би спречио уобичајене нападе. Аутоматизоване безбедносне контроле су кључне за сваки радни ток развоја софтвера како би се смањило време од настанка до откривања грешке. Ове провере се покрећу при свакој промени кода, сваки пут."
        points:
            security_1: 'Безбедно хеширање лозинки са Аргон2 или Содиум'
            security_2: 'Детаљне корисничке улоге које ограничавају приступ'
            security_3: 'CSRF и XSS заштита'
            security_4: 'Континуирана интеграција са хиљадама провера'
            security_5: 'Детаљни прегледи кода'
            security_6: 'Аутоматизовано тестирање кода са покривеношћу кода изнад 90%'
    security-cloud:
        name: "Безбедност платформе"
        description: "Софтвер је безбедан онолико колико је безбедан систем на ком ради. Примењујем вишеслојни приступ заштити сервера и мрежне инфраструктуре. Корисници на хостованој платформи заштићени су вишеструким слојевима заштите."
        points:
            security_1: 'Све везе заштићене путем TLS-а (SSL)'
            security_2: 'Најбоље праксе безбедности, firewall-ови и заштита од brute-force напада'
            security_3: 'Без дељеног закупа, сваки клијент има сопствену базу података'
            security_4: 'Сервери се налазе у дата центру у ЕУ'
            security_5: 'Критични сервиси нису доступни спољном свету'
            security_6: 'Код се извршава у строго ограниченим окружењима домена'
    electronic-invoicing:
        name: "Е-фактуре"
        description: "Направи е-фактуре у XML и PDF/А форматима, у складу са EN 16931, XRechnung 3.0, Zugferd/Factur-X, користећи CII и UBL синтаксу"
    eu-hosting:
        name: "ЕУ хостинг"
        description: "Независно и европско 🇪🇺 – направљено у Аустрији 🇦🇹 и хостовано у Немачкој 🇩🇪"
install:
    ssh: 'Овај начин инсталира Kimai директно на твој сервер.'
    docker: 'Користи наш Docker пакет за једноставну инсталацију и ажурирање Kimai контејнера.'
    kubernetes: 'Kimai можеш имплементирати на Kubernetes помоћу наших Helm Charts пакета.'
    cloud: 'Kimai не мораш да инсталираш, можеш одмах да почнеш да га користиш.'
    caddy-docker: 'Коришћење Docker Compose и Caddy као reverse-проксија са SSL подршком.'
    alert-vps: 'У овом тренутку није могуће инсталирати Kimai преузимањем ZIP фајла и отпремањем фајлова на твој веб сервер. Мораш имати SSH приступ свом серверу. То не значи нужно да ти је потребан VPS. Неки дељени хостинг провајдери пружају SSH приступ преко ког можеш без проблема да инсталираш Composer и Kimai.'
developer:
    kevinpapst:
        intro: |-
            Одувек сам сањао да зарађујем за живот производом отвореног кода. Са Kimai-јем сам успео да развијем софтвер који пружа велику вредност мојим клијентима и чији ме развој покреће сваког дана.

            Посебно се захваљујем великој заједници на њиховој оданости током година, радујем се наредних 10 година Kimai-ja 🚀
history:
    early-days-subtitle: "Kimai има дугу историју и постоји од 2006. године, ево кратког прегледа како је све почело."
    early-days-title: "Како је све почело"
    year-2006: "Прва верзија Kimai-ја је објављена и полако расте база корисника и програмера."
    year-2009: "Torsten, оригинални програмер, жели да угаси Kimai. Kevin преузима улогу и постаје одржавалац пројекта."
    year-2014: "Последње издање Kimai-ја 1 је направљено, развој застаје и нема много даљих активности."
    year-2018: "Нова верзија Kimai-ја проналази свој пут до заједнице, миграција података функционише, прихватање расте."
    year-2019: "Први додаци су направљени како би се испитало интересовање за плаћени софтвер отвореног кода."
    year-2020: "Kimai се нуди као SaaS на бази претплате, са једним бесплатним и два плаћена плана."
    year-2023: "Напоран рад се коначно исплатио и Kimai је сада мој посао са пуним радним временом. Хвала вам пуно!"
    current: |
        Kimai је софтвер за евидентирање времена са дугом историјом, прва верзија је објављена давне 2006. године. Зашто ово помињем? Зато што сам од тада видео многе програме како долазе и одлазе – веруј ми кад кажем: Kimai је ту да остане. Провео сам много година развијајући Kimai из забаве, данас је Kimai мој посао и никад нисам био мотивисанији да га стално побољшавам.

        Kimai сам направио са једним циљем: да бележи, управља, оцењује и обрачунава радне сате. Kimai подржава неограничен број корисника, клијената, пројеката и уноса времена, тако да можеш да управљаш свим својим тимовима у једној инсталацији која је једноставна за коришћење. Kimai је преведен на десетине језика и ради на било ком уређају са приступом интернету и прегледачем, чак и на твом мобилном уређају када си у покрету, захваљујући респонзивном дизајну.

        Фактуре можеш да направиш из својих евиденција времена директно у прегледачу, уз прилагодљиве шаблоне фактура. Kimai се такође може проширити на много начина, посебно кроз бројне додатке које је направила активна заједница.

        Било да си фриленсер, мала организација или компанија са стотинама запослених, Kimai ти може помоћи да управљаш својим пословањем. Одлучи се и тестирај Kimai уз помоћ демо инсталација.
    past: |
        Kimai има дугу историју и био је далеко испред свог времена када је тим Torstena Höltge-а почео да га развија 2006. године. Имао је респонзиван дизајн (захваљујући мноштву Javascript трикова) у време када та реч чак није била ни званично измишљена.
        Преузео сам развој Kimai-ја 2009. године, када је Torsten желео да га обустави због недостатка времена, и одржавао сам и проширивао Kimai неколико година уз помоћ других ентузијаста отвореног кода.

        У међувремену је PHP заједница правила велике кораке, док је Kimai све више заостајао због своје историје. Основа је имала многе техничке слабости, и након много година развоја, базу кода је било све теже одржавати.
        Идеја о поновном писању Kimai-jа са модерним фрејмворцима постојала је већ неко време, подстакнута и захтевима заједнице, али нико није имао ресурсе да ту идеју погура напред. Крајем 2017. године се поклопило неколико фактора и искористио сам тренутак да почнем развој следећег еволуцијског корака, "Kimai 2".

        Оригинални Kimai је први пут објављен 2006. године и користили су га многи људи широм света, поносан сам на то, као и на његову сјајну заједницу. Желео бих да се захвалим свима који су допринели Kimai-jу.
