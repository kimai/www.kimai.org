about:
    name: 'О Kimai-ју'
    subtitle: "Оно што је почело као хоби пројекат сада је водећа светска апликација отвореног кода за евидентирање времена. Погледајмо његову историју."
    description: 'Сазнај више о историји програма за евидентирање времена Kimai и његовом програмеру.'
    kevin: 'Kimai и Cloud развија и њима управља Kevin, независни програмер из Беча (Аустрија).'
    collaboration:
        title: 'Сарадња'
        content: 'Корисници цене погодност бесплатне подршке, а размена је битан део мог рада. Волим ангажман заједнице на GitHub-у, сарадњу и агилан рад. Стално унапређење на основу ваших повратних информација чини ово путовање изузетним искуством.'
    technology:
        title: 'Технологија'
        content: 'Као програмер, волим да тестирам нове технологије. А ако то побољшава начин на који комуницираш са Kimai-јем, назвао бих то ситуацијом у којој сви добијају. Кориснички интерфејс и корисничко искуство су ми кључни јер софтвер мора бити једноставан за коришћење. Безбедност је основни захтев, а софтвер отвореног кода је важан фактор успеха за многе компаније.'
    joy:
        title: 'Радост у послу'
        content: 'Развој Kimai-ја је идеална комбинација струке коју волим, са бескрајним могућностима усавршавања, и потребе да зарађујем новац како бих издржавао своју породицу. Захваљујући Kimai-ју, могу да проводим више времена са супругом и дететом, што је вероватно најбоља мотивација коју можеш да замислиш.'
