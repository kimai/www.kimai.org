developer:
    kevinpapst:
        intro: |-
            Oduvek sam sanjao da zarađujem za život proizvodom otvorenog koda. Sa Kimaiem sam uspeo da razvijem softver koji pruža veliku vrednost mojim klijentima i čiji me razvoj pokreće svakog dana.

            Posebno se zahvaljujem velikoj zajednici na njihovoj odanosti tokom godina, radujem se narednih 10 godina Kimaia 🚀
history:
    early-days-subtitle: "Kimai ima dugu istoriju i postoji od 2006. godine, evo kratkog pregleda kako je sve počelo."
    early-days-title: "Kako je sve počelo"
    year-2006: "Prva verzija Kimaia je objavljena i polako raste baza korisnika i programera."
    year-2009: "Torsten, originalni programer, želi da ugasi Kimai. Kevin preuzima ulogu i postaje održavalac projekta."
    year-2014: "Poslednje izdanje Kimaia 1 je napravljeno, razvoj zastaje i nema mnogo daljih aktivnosti."
    year-2018: "Nova verzija Kimaia pronalazi svoj put do zajednice, migracija podataka funkcioniše, prihvatanje raste."
    year-2019: "Prvi dodaci su napravljeni kako bi se ispitalo interesovanje za plaćeni softver otvorenog koda."
    year-2020: "Kimai se nudi kao SaaS na bazi pretplate, sa jednim besplatnim i dva plaćena plana."
    year-2023: "Naporan rad se konačno isplatio i Kimai je sada moj posao sa punim radnim vremenom. Hvala vam puno!"
    current: |
        Kimai je softver za evidentiranje vremena sa dugom istorijom, prva verzija je objavljena davne 2006. godine. Zašto ovo pominjem? Zato što sam od tada video mnoge programe kako dolaze i odlaze – veruj mi kad kažem: Kimai je tu da ostane. Proveo sam mnogo godina razvijajući Kimai iz zabave, danas je Kimai moj posao i nikad nisam bio motivisaniji da ga stalno poboljšavam.

        Kimai sam napravio sa jednim ciljem: da beleži, upravlja, ocenjuje i obračunava radne sate. Kimai podržava neograničen broj korisnika, klijenata, projekata i unosa vremena, tako da možeš da upravljaš svim svojim timovima u jednoj instalaciji koja je jednostavna za korišćenje. Kimai je preveden na desetine jezika i radi na bilo kom uređaju sa pristupom internetu i pregledačem, čak i na tvom mobilnom uređaju kada si u pokretu, zahvaljujući responzivnom dizajnu.

        Fakture možeš da napraviš iz svojih evidencija vremena direktno u pregledaču, uz prilagodljive šablone faktura. Kimai se takođe može proširiti na mnogo načina, posebno kroz brojne dodatke koje je napravila aktivna zajednica.

        Bilo da si frilenser, mala organizacija ili kompanija sa stotinama zaposlenih, Kimai ti može pomoći da upravljaš svojim poslovanjem. Napravi sopstveni utisak i testiraj Kimai uz pomoć demo instalacija.
    past: |
        Kimai ima dugu istoriju i bio je daleko ispred svog vremena kada je tim Torstena Höltgea počeo da ga razvija 2006. godine. Imao je responzivan dizajn (zahvaljujući mnoštvu Javascript trikova) u vreme kada ta reč čak nije bila ni zvanično izmišljena.
        Preuzeo sam razvoj Kimai-ja 2009. godine, kada je Torsten želeo da ga obustavi zbog nedostatka vremena, i održavao sam i proširivao Kimai nekoliko godina uz pomoć drugih entuzijasta otvorenog koda.

        U međuvremenu je PHP zajednica pravila velike korake, dok je Kimai sve više zaostajao zbog svoje istorije. Osnova je imala mnoge tehničke slabosti, i nakon mnogo godina razvoja, bazu koda je bilo sve teže održavati.
        Ideja o ponovnom pisanju Kimaia sa modernim frejmvorcima postojala je već neko vreme, podstaknuta i zahtevima zajednice, ali niko nije imao resurse da tu ideju pogura napred. Krajem 2017. godine se poklopilo nekoliko faktora i iskoristio sam trenutak da počnem razvoj sledećeg evolucijskog koraka, "Kimai 2".

        Originalni Kimai je prvi put objavljen 2006. godine i koristili su ga mnogi ljudi širom sveta, ponosan sam na to, kao i na njegovu sjajnu zajednicu. Želeo bih da se zahvalim svima koji su doprineli Kimai-iu.
