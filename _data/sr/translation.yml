        description: "Активности се користе за додељивање јединице рада уносима у евиденцијама времена. Управљај активностима за сваки пројекат са бројем наруџбине, буџетом и видљивошћу (за архивирање) или направи глобалне активности да би спречио/ла дуплирање."
    invoices:
