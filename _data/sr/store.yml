items:
    alexandreptj-kemai-desktop-client:
        title: 'Kemai — Desktop klijent'
        intro: 'Multiplatformski GUI klijent za Kimai'
    cloudrizon-kimai-mobile-app-android:
        title: 'Kimai Mobile (Android)'
        intro: 'Kimai Mobile je aplikacija za praktično korišćenje Kimai-ja na vašem Android uređaju'
    cloudrizon-kimai-mobile-app-ios:
        title: 'Kimai Mobile (iOS)'
        intro: 'Pristupite Kimai-ju sa svog iOS uređaja pomoću aplikacije Kimai Mobile'
    district09-archive-timesheets-command-bundle:
        title: 'Komanda za arhiviranje evidencija vremena'
        intro: 'Omogućava arhiviranje evidencija vremena starijih od zadatog vremenskog okvira, pomoću komande.'
    district09-personal-calendar-pref-bundle:
        title: 'Lične postavke kalendara'
        intro: 'Omogućava korisnicima da podese prilagođeno vreme početka i kraja za kalendar u svojim ličnim podešavanjima.'
    gbs-zip-projectrenderer-bundle:
        title: 'ZipProjectRenderer (izvoz ZIP-a sa po jednim PDF-om za svaki projekat)'
        intro: 'Izvezite po jedan PDF fajl za svaki projekat za više izabranih projekata.'
    glorpen-duration-bundle:
        title: 'Prilagodljivo zaokruživanje trajanja'
        intro: 'Prepišite zaokruživanje trajanja za klijente, projekte i aktivnosti'
    infeeeee-kimai2-cmd-argos:
        title: 'Argos/Kargos/xbar dodatak za traku menija'
        intro: 'Postavite Kimai na svoju gornju traku!'
    infeeeee-kimai2-cmd-rainmeter:
        title: 'Rainmeter vidžet'
        intro: 'Kimai vidžet za Windows!'
    infeeeee-kimai2-cmd:
        title: 'Klijent za komandnu liniju'
        intro: 'Multiplatformski klijent za komandnu liniju za Kimai, napisan u Node.js-u'
    katjaglass-approval-bundle:
        title: 'Radni tok odobravanja za evidencije vremena'
        intro: 'Ovaj dodatak omogućava nedeljno odobravanje evidencija vremena.'
    katjaglass-timekex:
        title: 'TimeKex - Uvoz Excel evidencija vremena'
        intro: 'Uvezite svoja vremena vođena u Excel-u u Kimai na nedeljnoj osnovi. Dostupan je i jednostavan uvoz klijenata/projekata/aktivnosti iz Excel-a.'
    audit-trail-bundle:
        title: 'Dnevnici revizije (audit trail)'
        intro: 'Beleži detaljne dnevnike izmena/revizija za evidencije vremena, klijente, projekte i aktivnosti i prikazuje ih u vremenskoj liniji za svaku stavku.'
    controlling:
        title: "Radni sati, godišnji odmor, bolovanje, državni praznici"
        intro: "Upravljanje zaposlenima: radni sati i prekovremeni rad. Godišnji odmori, bolovanja i slobodni dani. Upravljanje državnim praznicima i integracija sa kalendarom. Mesečna odobrenja sa PDF-om."
    console-phar:
        title: 'Konzolni klijent (PHAR)'
        intro: 'Multiplatformski konzolni klijent za Kimai'
    potx8o-kimai-vscode:
        title: 'VSCode / VSCodium'
        intro: 'VSCode ekstenzija za pokretanje i zaustavljanje vaših tajmera'
    keleo-css-custom-bundle:
        title: 'Prilagođeni CSS'
        intro: 'Omogućava dodavanje prilagođenih CSS pravila putem administratorskog ekrana.'
    custom-content-bundle:
        title: 'Prilagođeni sadržaj'
        intro: 'Kreirajte prilagođeni sadržaj za stilove, Javascript, globalnu poruku upozorenja i novu stranicu za prikaz markdown sadržaja za vesti kompanije.'
    custom-fields-bundle:
        title: 'Prilagođena polja'
        intro: 'Kreirajte slobodno podesiva dodatna polja za evidencije vremena, klijente, projekte, aktivnosti i korisnike u različitim formatima. Polja mogu biti opciona ili obavezna i ograničena ovlašćenjima.'
    custom-plugins:
        title: 'Prilagođeni razvoj (dodaci, šabloni za fakture i izvoz)'
        intro: 'Želite posebnu funkciju koja još nije dostupna u Kimai-ju? Mogu je razviti za vas.'
    keleo-deduction-time-bundle:
        title: 'Dodatak za odbitno vreme'
        intro: 'Podesite aktivnosti kao odbitna vremena i sačuvajte negativna trajanja'
    expenses-bundle:
        title: 'Upravljanje troškovima'
        intro: 'Pratite svoje troškove na osnovu klijenta i projekta. Ovi troškovi mogu biti kategorisani i uključeni u vaše fakture.'
    fail2ban-bundle:
        title: 'Fail2Ban za prijave'
        intro: 'Dodatak kompatibilan sa Fail2Ban-om, koji beleži neuspele pokušaje prijave'
    grandtotal-plugin-for-kimai:
        title: 'GrandTotal sinhronizacija'
        intro: 'GrandTotal dodatak, koji omogućava uvoz Kimai evidencija vremena'
    keleo-importer-bundle:
        title: 'Uvoznik (CSV i JSON)'
        intro: 'Omogućava uvoz CSV fajlova putem administratorskog ekrana.'
    installation-support:
        title: 'Podrška za instalaciju i ažuriranje'
        intro: 'Želite da koristite Kimai, ali ne znate kako da ga instalirate na svoj server?'
    invoice-bundle:
        title: 'E-Račun Plus'
        intro: "E-fakture (EN16931, XRechnung, ZUGFeRD, Factur-X), automatski PDF izvoz evidencija vremena i naprednije funkcije fakturisanja"
    keleo-invoice-format-fixation-bundle:
        title: 'Fiksni format podataka fakture (po jeziku)'
        intro: 'Omogućite podešavanje globalnog jezika za formate podataka fakture.'
    kiosk-barcode-bundle:
        title: 'Kiosk režim sa podrškom za barkod, RFID, Web NFC'
        intro: 'Evidentiranje prisustva u okruženju gde korisnik nema pristup Kimai-ju (npr. u magacinu), korišćenjem barkod ili RFID skenera za pokretanje i zaustavljanje evidencija vremena.'
    lockdown-per-user-bundle:
        title: 'Zaključavanje po korisniku'
        intro: 'Podesite period zaključavanja po korisniku u korisničkim podešavanjima.'
    keleo-recalculate-rates-bundle:
        title: 'Ponovno izračunavanje cena'
        intro: 'Prisiljava ponovno izračunavanje cene po satu/fiksne cene prilikom svakog ažuriranja evidencije vremena'
    task-management-bundle:
        title: 'Planiranje zadataka'
        intro: 'Kreirajte zadatke, pokrećite/zaustavljajte/pauzirajte ih, dodeljujte ih korisnicima i timovima i evidentirajte vreme za njih — upravljajte listama obaveza uz pomoć Kimai-ja'
    translation-bundle:
        title: 'Prevodi'
        intro: 'Promenite sve vidljive elemente (nazive polja u formama, zaglavlja tabela, stavke menija …) u svojoj Kimai instalaciji sopstvenim prevodima'
    liaraalis-small-business-rule-bundle:
        title: 'Propisi za mala preduzeća'
        intro: 'Koristite propis za mala preduzeća, koji se primenjuje u Nemačkoj i Austriji, prilikom kreiranja faktura u Kimai-ju.'
    maximiliangross-easy-backup-bundle:
        title: 'Easy Backup'
        intro: 'Jednim klikom kreirate potpunu rezervnu kopiju svog Kimai okruženja'
    neontribe-chrome-plugin:
        title: 'ChromePlugin most ka Kimai-ju'
        intro: 'Omogućava beleženje vremena iz ChromePlugin tiketa u Kimai instancu.'
    pcsg-recurring-budget-bundle:
        title: 'Ponavljajući budžeti'
        intro: 'Automatski dodaje novac ili vreme u budžete vaših projekata na ponavljajućoj osnovi sa prilagođenim intervalom.'
    ticesoftware-kimaibar-macos-client:
        title: 'KimaiBar – nativna macOS aplikacija za traku menija'
        intro: 'Pratite svoje vreme pomoću nativne macOS aplikacije KimaiBar u traci menija i dobijajte podsetnike za neaktivnost.'
    customer-portal:
        title: 'Portal za klijente'
        intro: 'Podelite statistiku klijenata i projekata i evidencije vremena sa bilo kim putem tajnog URL-a, po želji zaštićenog lozinkom.'
    owlysk-codetimer:
        title: 'CodeTimer Desktop'
        intro: 'Desktop aplikacija za Kimai (Windows, Mac i Linux)'
    helsinkisystems-budgetwatcher:
        title: 'Pratilac Budžeta'
        intro: 'Dobijajte obaveštenja kad god se određeni iznos budžeta vašeg projekta iskoristi'
    helsinkisystems-lexoffice:
        title: 'Lexoffice sinhronizacija faktura'
        intro: 'Kad god se u Kimai-ju kreira faktura, ovaj dodatak automatski kreira Lexoffice fakturu.'
    simonschaufi-customer-email-report-bundle:
        title: 'Email izveštaj za klijente'
        intro: 'Pošaljite klijentima email izveštaj o vašim radnim satima'
    lnngyn-period-insert-bundle:
        title: 'Unos perioda'
        intro: 'Generišite unose za dati vremenski period.'
    owlysk-codetimer-mobile:
        title: 'CodeTimer Mobile'
        intro: 'Android klijent za Kimai (besplatan i otvorenog koda)'
    eon-timer:
        title: 'Eon Timer'
        intro: 'Evidentiranje vremena za Mac, besprekorno integrisano sa Kimai-jem – i lokalno i u oblaku.'
    playmoweb-kimtrack:
        title: 'KimTrack'
        intro: 'Desktop klijent za macOS, Windows i Linux za praćenje vremena sa vaše trake menija.'
    dolux-swiss-qr-bundle:
        title: 'QR fakture za Švajcarsku'
        intro: 'Švajcarski QR kodovi na vašim QR fakturama.'
    foraum-kimai-clock:
        title: 'KimaiClock'
        intro: 'macOS aplikacija za traku menija za praćenje vremena sa Kimai-jem'
    engazan-kimaitray:
        title: 'KimaiTray'
        intro: 'Prateća aplikacija u sistemskoj paleti za Kimai na macOS-u, Windows-u i Linux-u'
    drthomasentner-timai:
        title: 'Timai'
        intro: 'Kimai iOS klijent, evidentiranje vremena na iPhone-u i iPad-u'
    kleinitsolutions-teams-integration:
        title: 'Integracija sa Microsoft Teams'
        intro: 'Pomaže u organizovanju fajlova vezanih za projekat u Microsoft Teams-u'
    simple-accounting-bundle:
        title: 'Jednostavno računovodstvo'
        intro: 'Pratite naplativi rad naspram fakturisanih iznosa i ručnih korekcija po projektu.'
    mte90-plasmoid-kimai:
        title: 'KDE Plasmoid'
        intro: 'Pratite svoje aktivnosti u svom KDE okruženju'
    kloudshift-klockshift:
        title: 'KlockShift - integracija sa Bexio za švajcarske firme'
        intro: 'KlockShift povezuje Kimai i Bexio automatskom sinhronizacijom vaših unosa vremena u Bexio podatke za fakture. Napravljen posebno za švajcarske slobodnjake i mala i srednja preduzeća.'
