items:
    alexandreptj-kemai-desktop-client:
        title: 'Kemai — Десктоп клијент'
        intro: 'Мултиплатформски GUI клијент за Kimai'
    cloudrizon-kimai-mobile-app-android:
        title: 'Kimai Mobile (Android)'
        intro: 'Kimai Mobile је апликација за практично коришћење Kimai-ја на вашем Android уређају'
    cloudrizon-kimai-mobile-app-ios:
        title: 'Kimai Mobile (iOS)'
        intro: 'Приступите Kimai-ју са свог iOS уређаја помоћу апликације Kimai Mobile'
    district09-archive-timesheets-command-bundle:
        title: 'Команда за архивирање евиденција времена'
        intro: 'Омогућава архивирање евиденција времена старијих од задатог временског оквира, помоћу команде.'
    district09-personal-calendar-pref-bundle:
        title: 'Личне поставке календара'
        intro: 'Омогућава корисницима да подесе прилагођено време почетка и краја за календар у својим личним подешавањима.'
    gbs-zip-projectrenderer-bundle:
        title: 'ZipProjectRenderer (извоз ZIP-а са по једним PDF-ом за сваки пројекат)'
        intro: 'Извезите по један PDF фајл за сваки пројекат за више изабраних пројеката.'
    glorpen-duration-bundle:
        title: 'Прилагодлјиво заокруживање трајања'
        intro: 'Препишите заокруживање трајања за клијенте, пројекте и активности'
    infeeeee-kimai2-cmd-argos:
        title: 'Argos/Kargos/xbar додатак за траку менија'
        intro: 'Поставите Kimai на своју горњу траку!'
    infeeeee-kimai2-cmd-rainmeter:
        title: 'Раинметер виџет'
        intro: 'Kimai виџет за Windows!'
    infeeeee-kimai2-cmd:
        title: 'Клијент за командну линију'
        intro: 'Мултиплатформски клијент за командну линију за Kimai, написан у Node.js-у'
    katjaglass-approval-bundle:
        title: 'Радни ток одобравања за евиденције времена'
        intro: 'Овај додатак омогућава недељно одобравање евиденција времена.'
    katjaglass-timekex:
        title: 'TimeKex - Увоз Excel евиденција времена'
        intro: 'Увезите своја времена вођена у Excel-у у Kimai на недељној основи. Доступан је и једноставан увоз клијената/пројеката/активности из Excel-а.'
    audit-trail-bundle:
        title: 'Дневници ревизије (аудит траил)'
        intro: 'Бележи детаљне дневнике измена/ревизија за евиденције времена, клијенте, пројекте и активности и приказује их у временској линији за сваку ставку.'
    controlling:
        title: "Радни сати, годишњи одмор, боловање, државни празници"
        intro: "Управљање запосленима: радни сати и прековремени рад. Годишњи одмори, боловања и слободни дани. Управљање државним празницима и интеграција са календаром. Месечна одобрења са PDF-ом."
    console-phar:
        title: 'Конзолни клијент (ПХАР)'
        intro: 'Мултиплатформски конзолни клијент за Kimai'
    potx8o-kimai-vscode:
        title: 'ВСЦоде / ВСЦодиум'
        intro: 'ВСЦоде екстензија за покретање и заустављање ваших тајмера'
    keleo-css-custom-bundle:
        title: 'Прилагођени ЦСС'
        intro: 'Омогућава додавање прилагођених ЦСС правила путем администраторског екрана.'
    custom-content-bundle:
        title: 'Прилагођени садржај'
        intro: 'Креирајте прилагођени садржај за стилове, Javascript, глобалну поруку упозорења и нову страницу за приказ markdown садржаја за вести компаније.'
    custom-fields-bundle:
        title: 'Прилагођена поља'
        intro: 'Креирајте слободно подесива додатна поља за евиденције времена, клијенте, пројекте, активности и кориснике у различитим форматима. Поља могу бити опциона или обавезна и ограничена овлашћењима.'
    custom-plugins:
        title: 'Прилагођени развој (додаци, шаблони за фактуре и извоз)'
        intro: 'Желите посебну функцију која још није доступна у Kimai-ју? Могу је развити за вас.'
    keleo-deduction-time-bundle:
        title: 'Додатак за одбитно време'
        intro: 'Подесите активности као одбитна времена и сачувајте негативна трајања'
    expenses-bundle:
        title: 'Управљање трошковима'
        intro: 'Пратите своје трошкове на основу клијента и пројекта. Ови трошкови могу бити категорисани и укључени у ваше фактуре.'
    fail2ban-bundle:
        title: 'Фаил2Бан за пријаве'
        intro: 'Додатак компатибилан са Фаил2Бан-ом, који бележи неуспеле покушаје пријаве'
    grandtotal-plugin-for-kimai:
        title: 'GrandTotal синхронизација'
        intro: 'GrandTotal додатак, који омогућава увоз Kimai евиденција времена'
    keleo-importer-bundle:
        title: 'Увозник (CSV и JSON)'
        intro: 'Омогућава увоз CSV фајлова путем администраторског екрана.'
    installation-support:
        title: 'Подршка за инсталацију и ажурирање'
        intro: 'Желите да користите Kimai, али не знате како да га инсталирате на свој сервер?'
    invoice-bundle:
        title: 'Е-Рачун Плус'
        intro: "Е-фактуре (EN16931, XRechnung, ZUGFeRD, Factur-X), аутоматски PDF извоз евиденција времена и напредније функције фактурисања"
    keleo-invoice-format-fixation-bundle:
        title: 'Фиксни формат података фактуре (по језику)'
        intro: 'Омогућите подешавање глобалног језика за формате података фактуре.'
    kiosk-barcode-bundle:
        title: 'Киоск режим са подршком за баркод, RFID, Web NFC'
        intro: 'Евидентирање присуства у окружењу где корисник нема приступ Kimai-ју (нпр. у магацину), коришћењем баркод или RFID скенера за покретање и заустављање евиденција времена.'
    lockdown-per-user-bundle:
        title: 'Закључавање по кориснику'
        intro: 'Подесите период закључавања по кориснику у корисничким подешавањима.'
    keleo-recalculate-rates-bundle:
        title: 'Поновно израчунавање цена'
        intro: 'Присиљава поновно израчунавање цене по сату/фиксне цене приликом сваког ажурирања евиденције времена'
    task-management-bundle:
        title: 'Планирање задатака'
        intro: 'Креирајте задатке, покрећите/заустављајте/паузирајте их, додељујте их корисницима и тимовима и евидентирајте време за њих — управљајте листама обавеза уз помоћ Kimai-ја'
    translation-bundle:
        title: 'Преводи'
        intro: 'Промените све видљиве елементе (називе поља у формама, заглавља табела, ставке менија …) у својој Kimai инсталацији сопственим преводима'
    liaraalis-small-business-rule-bundle:
        title: 'Прописи за мала предузећа'
        intro: 'Користите пропис за мала предузећа, који се примењује у Немачкој и Аустрији, приликом креирања фактура у Kimai-ју.'
    maximiliangross-easy-backup-bundle:
        title: 'Easy Backup'
        intro: 'Једним кликом креирате потпуну резервну копију свог Kimai окружења'
    neontribe-chrome-plugin:
        title: 'ChromePlugin мост ка Kimai-ју'
        intro: 'Омогућава бележење времена из ChromePlugin тикета у Kimai инстанцу.'
    pcsg-recurring-budget-bundle:
        title: 'Понављајући буџети'
        intro: 'Аутоматски додаје новац или време у буџете ваших пројеката на понављајућој основи са прилагођеним интервалом.'
    ticesoftware-kimaibar-macos-client:
        title: 'KimaiBar – нативна macOS апликација за траку менија'
        intro: 'Пратите своје време помоћу нативне macOS апликације KimaiBar у траци менија и добијајте подсетнике за неактивност.'
    customer-portal:
        title: 'Портал за клијенте'
        intro: 'Поделите статистику клијената и пројеката и евиденције времена са било ким путем тајног URL-а, по жељи заштићеног лозинком.'
    owlysk-codetimer:
        title: 'CodeTimer Desktop'
        intro: 'Десктоп апликација за Kimai (Windows, Mac & Linux)'
    helsinkisystems-budgetwatcher:
        title: 'Пратилац Буџета'
        intro: 'Добијајте обавештења кад год се одређени износ буџета вашег пројекта искористи'
    helsinkisystems-lexoffice:
        title: 'Lexoffice синхронизација фактура'
        intro: 'Кад год се у Kimai-ју креира фактура, овај додатак аутоматски креира Lexoffice фактуру.'
    simonschaufi-customer-email-report-bundle:
        title: 'Email извештај за клијенте'
        intro: 'Пошаљите клијентима Email извештај о вашим радним сатима'
    lnngyn-period-insert-bundle:
        title: 'Унос периода'
        intro: 'Генеришите уносе за дати временски период.'
    owlysk-codetimer-mobile:
        title: 'CodeTimer Mobile'
        intro: 'Android клијент за Kimai (бесплатан и отвореног кода)'
    eon-timer:
        title: 'Еон Тимер'
        intro: 'Евидентирање времена за Mac, беспрекорно интегрисано са Kimai-јем – и локално и у облаку.'
    playmoweb-kimtrack:
        title: 'КимТрацк'
        intro: 'Десктоп клијент за macOS, Windows и Linux за праћење времена са ваше траке менија.'
    dolux-swiss-qr-bundle:
        title: 'QR фактуре за Швајцарску'
        intro: 'Швајцарски QR кодови на вашим QR фактурама.'
    foraum-kimai-clock:
        title: 'KimaiClock'
        intro: 'macOS апликација за траку менија за праћење времена са Kimai-јем'
    engazan-kimaitray:
        title: 'KimaiTray'
        intro: 'Пратећа апликација у системској палети за Kimai на macOS, Windows, и Linux'
    drthomasentner-timai:
        title: 'Timai'
        intro: 'Kimai iOS Client, евидентирање времена на iPhone -у и iPad-у'
    kleinitsolutions-teams-integration:
        title: 'Интеграција са Microsoft Teams'
        intro: 'Помаже у организовању фајлова везаних за пројекат у Microsoft Teams-у'
    simple-accounting-bundle:
        title: 'Једноставно рачуноводство'
        intro: 'Пратите наплативи рад наспрам фактурисаних износа и ручних корекција по пројекту.'
    mte90-plasmoid-kimai:
        title: 'КДЕ Пласмоид'
        intro: 'Пратите своје активности у свом КДЕ окружењу'
    kloudshift-klockshift:
        title: 'KlockShift - интеграција са Bexio за швајцарске фирме'
        intro: 'KlockShift повезује Kimai и Bexio аутоматском синхронизацијом ваших уноса времена у Bexio податке за фактуре. Направљен посебно за швајцарске слободњаке и мала и средња предузећа.'
screenshots:
    katjaglass-approval-bundle0:
        description: 'Приказује недељне детаље као што су радно време, очекивано време и радње попут слања на одобрење'
    katjaglass-approval-bundle1:
        description: 'Прегледни екран отворених прошлих одобрења одговарајућих чланова тима и сопственог, као и статус тренутне завршене недеље'
    katjaglass-approval-bundle2:
        description: 'Историју одобрења, укључујући све коментаре, могу видети вођа тима или корисници'
    katjaglass-approval-bundle3:
        description: 'Вође тимова могу одобрити или одбити недељно одобрење'
    katjaglass-approval-bundle4:
        description: 'Администратори имају иста овлашћења као вође тимова, а додатно могу прегледати све колеге у прегледу и имају опцију да повуку одобрење'
    audit-trail-bundle0:
        description: 'Прегледна страница свих дневника ревизије'
    audit-trail-bundle1:
        description: 'Овако може изгледати дневник ревизије, свака измена ће бити забележена и може се видети више уноса у временској линији објекта'
    audit-trail-bundle2:
        description: 'Детаљном дневнику ревизије приступате са странице са листом или из падајућег менија "Радње" у табели података за сваку ставку'
    keleo-css-custom-bundle0:
        description: 'Нова администраторска страница са свим доступним унапред припремљеним правилима'
    keleo-css-custom-bundle1:
        description: 'Подразумевани приказ евиденције времена пре коришћења правила'
    keleo-css-custom-bundle2:
        description: 'Приказ евиденције времена са активираним прилагођеним правилима за истицање активних уноса и скривање преклапајућих уноса'
    custom-content-bundle0:
        description: 'Порука упозорења се приказује на свакој страници за пријављене кориснике'
    custom-content-bundle1:
        description: 'Јавасцрипт се извршава на свакој страници за пријављене кориснике'
    custom-content-bundle2:
        description: 'Можете унети вест у markdown формату са насловом'
    custom-content-bundle3:
        description: 'Страница са вестима је повезана у корисничком менију и приказује вашу markdown поруку'
    custom-fields-bundle0:
        description: 'Страница са листом приказује све доступне врсте ставки и њихова подешена прилагођена поља'
    custom-fields-bundle1:
        description: 'Дијалог за креирање новог прилагођеног поља за клијенте'
    custom-fields-bundle2:
        description: 'Измена већ постојећег прилагођеног поља за пројекте (тип логичка вредност, види подразумевану вредност)'
    custom-fields-bundle3:
        description: 'Листа евиденција времена, са приказаним видљивим прилагођеним пољем под називом "Локација"'
    custom-fields-bundle4:
        description: 'Измена уноса евиденције времена са новим прилагођеним пољем типа листа за избор'
    expenses-bundle0:
        description: 'Листа свих забележених трошкова са пагинацијом'
    expenses-bundle1:
        description: 'Ваше трошкове можете филтрирати помоћу претраге доступне на више Kimai екрана'
    expenses-bundle2:
        description: 'Измена или креирање новог трошка омогућава вам унос ових поља'
    expenses-bundle3:
        description: 'Трошкови су категорисани ради бољег прегледа и опција филтрирања'
    expenses-bundle4:
        description: 'За сваку категорију можете подесити назив, фактор трошка и кратак текст помоћи'
    invoice-bundle0:
        description: 'Нова подешавања конфигурације за шаблон извоза и језик формата'
    invoice-bundle1:
        description: 'Нова подешавања фактуре за језик формата и шаблон извоза'
    keleo-invoice-format-fixation-bundle0:
        description: 'Подесите језик за форматирање свих подешавања фактуре'
    kiosk-barcode-bundle0:
        description: 'Приказује листу свих корисника са њиховим подешеним типовима кодова за пријаву'
    kiosk-barcode-bundle1:
        description: 'Подесите свој Киоск додатак према својим потребама, режим пријаве и формат кода зависе један од другог'
    kiosk-barcode-bundle2:
        description: 'Овај нови баркод сада може бити одштампан и предат кориснику'
    kiosk-barcode-bundle3:
        description: 'Режим пријаве "Баркод са USB скенером" приказује овакав екран, поље за унос је унапред изабрано и скенер ће га послати након што пронађе код'
    kiosk-barcode-bundle4:
        description: 'Екран за пријаву са активираном опционом листом корисника'
    kiosk-barcode-bundle5:
        description: 'Режим пријаве "Баркод са камером уређаја" приказује видео са камере и непрекидно скенира баркодове'
    kiosk-barcode-bundle6:
        description: 'Скенирање постојећег кода корисника покреће нову евиденцију времена'
    kiosk-barcode-bundle7:
        description: 'Или, ако је евиденција времена већ покренута, биће заустављена'
    task-management-bundle0:
        description: 'Нова администраторска страница са прегледом свих задатака са евидентираним временом, статусом и доделама'
    task-management-bundle1:
        description: 'Приликом креирања или ажурирања задатка, можете попунити ова поља'
    task-management-bundle2:
        description: 'Нови виџети контролне табле за додељене и незавршене задатке'
    translation-bundle0:
        description: 'Нова администраторска страница са прегледом свих измењених превода'
    translation-bundle1:
        description: 'Дијалог за додавање омогућава проналажење ниске претрагом њеног садржаја'
    translation-bundle2:
        description: 'Дијалог за измену омогућава мењање вашег прилагођеног превода'
    maximiliangross-easy-backup-bundle0:
        description: 'Нова администраторска страница са резервним копијама'
    pcsg-recurring-budget-bundle0:
        description: 'Подешавања пројекта за понављајући буџет.'
    pcsg-recurring-budget-bundle1:
        description: 'Излаз CLI команде која одобрава буџете и израчунава статистику пројекта.'
    pcsg-recurring-budget-bundle2:
        description: 'Пример PDF извоза резимеа буџета за један месец.'
    pcsg-recurring-budget-bundle3:
        description: 'Приказује све пројекте са њиховим тренутно доступним (временским или новчаним) буџетима и укупним буџетима.'
    pcsg-recurring-budget-bundle4:
        description: 'Приказује све завршене интервале буџета и показује статистику за сваки од њих.'
    pcsg-recurring-budget-bundle5:
        description: 'Пример Email поруке са статистиком буџета послате вођи тима пројекта након завршеног интервала буџета.'
    ticesoftware-kimaibar-macos-client1:
        description: 'Паметно евидентирање времена у вашој траци менија'
