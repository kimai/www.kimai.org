{% assign map = site.data['customer-map'] %}
{% assign t = site.data[page.lang].translation.map %}
{% comment %}
	"<file name>:<label>", the SVGs are generated by scripts/generate-world-map.sh
	{% assign projections = "miller:Miller,eqearth:Equal Earth" | split: "," %}
{% endcomment %}
{% assign projections = "miller:Miller" | split: "," %}

{% comment %} Only offer datasets that have at least one country with a value, the first one is shown by default {% endcomment %}
{% assign datasets = "" | split: "" %}
{% for dataset in map.datasets %}
    {% for country in map.countries %}
        {% if country[1][dataset] %}
            {% assign datasets = datasets | push: dataset %}
            {% break %}
        {% endif %}
    {% endfor %}
{% endfor %}

<section class="pb-5 pt-md-1 pt-lg-4 pt-xl-5 mb-5" id="world-map">
	<div class="container py-2 py-md-3 py-lg-4 py-xl-5">
		<div class="mt-4 py-2 pb-sm-3 pb-md-4 pb-lg-5 mx-auto text-center title-header">
			<h2 class="h1 mb-4">{{ site.data[page.lang].translation.map.title }}</h2>
			<p class="mb-4">{{ t.subtitle | replace: '%count%', map.countries.size | replace: '%teams%', site.kimai_customers }}</p>
		</div>
		{% comment %}
		{% if datasets.size > 1 %}
		<div class="d-flex justify-content-center mb-4">
			<div class="btn-group" role="group">
				{% for dataset in datasets %}
				<input type="radio" class="btn-check" name="world-map-dataset" id="world-map-dataset-{{ dataset }}" value="{{ dataset }}" autocomplete="off"{% if forloop.first %} checked{% endif %}>
				<label class="btn btn-outline-primary" for="world-map-dataset-{{ dataset }}">{{ t[dataset] | default: dataset }}</label>
				{% endfor %}
			</div>
		</div>
		{% endif %}
		{% endcomment %}

		<figure class="world-map-figure" data-world-map data-src="/images/world-map-%projection%.svg" data-projection="miller" data-dataset="{{ datasets.first }}" data-lang="{{ page.lang }}" data-label="{{ t.title | escape }}">
			<div class="world-map-stage">
				<div class="world-map-canvas" data-world-map-canvas></div>
				<div class="tooltip bs-tooltip-top world-map-tooltip" role="tooltip" aria-hidden="true" data-world-map-tooltip>
					<div class="tooltip-arrow"></div>
					<div class="tooltip-inner"></div>
				</div>
			</div>
			<figcaption class="world-map-legend">
				<ul class="list-unstyled">
					{% for level in map.levels %}
					<li><span class="world-map-swatch" data-level="{{ level }}"></span><span data-level-label="{{ level }}">{% if level == 1 %}{{ t.level_one }}{% else %}{{ t.level_many | replace: '%count%', level }}{% endif %}</span></li>
					{% endfor %}
				</ul>
			</figcaption>
			{% comment %}
			<div class="world-map-projections">
				<div class="btn-group btn-group-sm" role="group">
					{% for projection in projections %}
					{% assign projection_parts = projection | split: ":" %}
					<input type="radio" class="btn-check" name="world-map-projection" id="world-map-projection-{{ projection_parts[0] }}" value="{{ projection_parts[0] }}" autocomplete="off"{% if forloop.first %} checked{% endif %}>
					<label class="btn btn-outline-secondary" for="world-map-projection-{{ projection_parts[0] }}">{{ projection_parts[1] }}</label>
					{% endfor %}
				</div>
			</div>
			{% endcomment %}
		</figure>
	</div>
</section>

<script type="application/json" id="world-map-data">{{ map | jsonify }}</script>
<script>
(function () {
    const figure = document.querySelector('[data-world-map]');
    const canvas = figure.querySelector('[data-world-map-canvas]');
    const tooltip = figure.querySelector('[data-world-map-tooltip]');
    const tooltipInner = tooltip.querySelector('.tooltip-inner');
    const tooltipArrow = tooltip.querySelector('.tooltip-arrow');
    const data = JSON.parse(document.getElementById('world-map-data').textContent);
    const levels = data.levels.slice().sort((a, b) => a - b);

    const labels = {};
    figure.querySelectorAll('[data-level-label]').forEach((el) => {
        labels[el.dataset.levelLabel] = el.textContent.trim();
    });

    let countryNames = null;
    try {
        countryNames = new Intl.DisplayNames([figure.dataset.lang, 'en'], { type: 'region' });
    } catch (e) {}

    const countryName = (iso) => {
        try {
            return countryNames ? countryNames.of(iso) : iso;
        } catch (e) {
            return iso;
        }
    };

    // the highest level reached by a value, 0 if none
    const levelOf = (value) => levels.reduce((result, level) => (value >= level ? level : result), 0);

    const countryLevel = (iso) => levelOf((data.countries[iso] || {})[figure.dataset.dataset] || 0);

    const render = () => {
        canvas.querySelectorAll('svg [data-iso]').forEach((el) => {
            const level = countryLevel(el.dataset.iso);
            if (level > 0) {
                el.setAttribute('data-level', level);
            } else {
                el.removeAttribute('data-level');
            }
        });
    };

    const hideTooltip = () => tooltip.classList.remove('show');

    const showTooltip = (iso, clientX, clientY) => {
        const level = countryLevel(iso);
        const name = document.createElement('strong');
        name.textContent = countryName(iso);
        tooltipInner.replaceChildren(name);
        if (level > 0) {
            tooltipInner.append(document.createElement('br'), labels[level]);
        }

        // keep the tooltip inside the map, the arrow always points to the cursor
        const stage = canvas.getBoundingClientRect();
        const x = clientX - stage.left;
        const left = Math.min(Math.max(x - tooltip.offsetWidth / 2, 0), Math.max(stage.width - tooltip.offsetWidth, 0));
        tooltip.style.left = left + 'px';
        tooltip.style.top = (clientY - stage.top) + 'px';
        tooltipArrow.style.left = (x - left - tooltipArrow.offsetWidth / 2) + 'px';
        tooltip.classList.add('show');
    };

    const onPointer = (event) => {
        const el = event.target.closest('[data-iso]');
        if (el === null) {
            hideTooltip();
            return;
        }
        showTooltip(el.dataset.iso, event.clientX, event.clientY);
    };

    canvas.addEventListener('pointermove', onPointer);
    canvas.addEventListener('pointerdown', onPointer);
    canvas.addEventListener('pointerleave', hideTooltip);

    const svgCache = {};
    const loadProjection = (projection) => {
        if (svgCache[projection] === undefined) {
            svgCache[projection] = fetch(figure.dataset.src.replace('%projection%', projection)).then((response) => {
                if (!response.ok) {
                    throw new Error('Failed to load world map: ' + response.status);
                }
                return response.text();
            });
        }
        figure.dataset.projection = projection;

        return svgCache[projection].then((svg) => {
            // ignore responses for a projection that is no longer selected
            if (figure.dataset.projection !== projection) {
                return;
            }
            hideTooltip();
            canvas.innerHTML = svg;
            const map = canvas.querySelector('svg');
            map.setAttribute('aria-label', figure.dataset.label);
            canvas.style.aspectRatio = map.viewBox.baseVal.width + ' / ' + map.viewBox.baseVal.height;
            render();
        });
    };

    loadProjection(figure.dataset.projection).catch(() => figure.classList.add('d-none'));

    document.querySelectorAll('input[name="world-map-projection"]').forEach((input) => {
        input.addEventListener('change', (event) => {
            loadProjection(event.target.value).catch((error) => console.error(error));
        });
    });

    document.querySelectorAll('input[name="world-map-dataset"]').forEach((input) => {
        input.addEventListener('change', (event) => {
            figure.dataset.dataset = event.target.value;
            render();
        });
    });
})();
</script>
