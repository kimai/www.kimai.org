---
layout: none
sitemap: false
permalink: /redirect-map.conf
# Browser language tags that do not map one-to-one to a website locale.
# Order matters: the first matching entry wins, so the zh_Hant aliases must
# come before the zh_Hans catch-all ("zh"). Entries for locales that are not
# listed in "languages" (see _config.yml) are skipped.
aliases:
  - locale: zh_Hant
    match: zh-tw|zh-hk|zh-mo
  - locale: zh_Hans
    match: zh-cn|zh-sg|zh
---
{%- comment -%}
Generates the nginx configuration that redirects https://www.kimai.org/ to the
best matching language version. The language list is taken from "languages"
in _config.yml, so this file does not need manual updates when a locale is
added or removed.

Collect the unique base languages (de, pt, zh, ...) for the first map.
{%- endcomment -%}
{%- assign bases = "" | split: "" -%}
{%- for language in site.languages -%}
    {%- assign base = language | split: "_" | first | downcase -%}
    {%- unless bases contains base -%}
        {%- assign bases = bases | push: base -%}
    {%- endunless -%}
{%- endfor -%}
# Language redirect for https://www.kimai.org/ - generated by Jekyll from redirect-map.conf
#
# Include this file in the "http" context of nginx, for example:
#   include /var/www/www.kimai.org/redirect-map.conf;
#
# It defines the variable $kimai_lang, which is used by the redirect:
#   location = / {
#       return 302 /$kimai_lang/;
#   }
#
# Supported locales: {{ site.languages | join: ", " }}

# Step 1: find the first language tag in the Accept-Language header that the website supports.
# Browsers send the header ordered by preference, for example:
#   de-AT,de;q=0.9,en-US;q=0.8,en;q=0.7
# Tags of unsupported languages in front (for example "ja,de") are skipped.
map $http_accept_language $kimai_lang_tag {
    default "";
    "~*^(?:\s*(?:[a-z]{1,8}(?:-[a-z0-9]{1,8})*|\*)(?:\s*;\s*q=[0-9.]+)?\s*,)*?\s*(?<tag>(?:{{ bases | join: "|" }})(?:-[a-z0-9]{1,8})*)\s*(?:;|,|$)" $tag;
}

# Step 2: normalize the browser tag to the locale directory of the website.
# The first matching regex wins, so regional variants come before base languages.
map $kimai_lang_tag $kimai_lang {
    default en;
{%- for language in site.languages -%}
    {%- if language contains "_" -%}
        {%- assign browser_tag = language | downcase | replace: "_", "-" %}
    "~*^{{ browser_tag }}(?:-|$)" {{ language }};
    {%- endif -%}
{%- endfor -%}
{%- for alias in page.aliases -%}
    {%- if site.languages contains alias.locale %}
    "~*^(?:{{ alias.match }})(?:-|$)" {{ alias.locale }};
    {%- endif -%}
{%- endfor -%}
{%- for language in site.languages -%}
    {%- unless language contains "_" %}
    "~*^{{ language }}(?:-|$)" {{ language }};
    {%- endunless -%}
{%- endfor %}
}
