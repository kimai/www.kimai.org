# Language redirect for https://www.kimai.org/ - generated by Jekyll from redirect-map.conf
#
# Include this file in the "http" context of nginx, for example:
#   include /var/www/www.kimai.org/redirect-map.conf;
#
# It defines the variable $kimai_lang, which is used by the redirect:
#   location = / {
#       return 302 /$kimai_lang/;
#   }
#
# Supported locales: ca, cs, de, en, es, fr, he, hr, it, nl, pl, pt, pt_BR, ru, sk, sr, sv, ta, uk, zh_Hans, zh_Hant

# Step 1: find the first language tag in the Accept-Language header that the website supports.
# Browsers send the header ordered by preference, for example:
#   de-AT,de;q=0.9,en-US;q=0.8,en;q=0.7
# Tags of unsupported languages in front (for example "ja,de") are skipped.
map $http_accept_language $kimai_lang_tag {
    default "";
    "~*^(?:\s*(?:[a-z]{1,8}(?:-[a-z0-9]{1,8})*|\*)(?:\s*;\s*q=[0-9.]+)?\s*,)*?\s*(?<tag>(?:ca|cs|de|en|es|fr|he|hr|it|nl|pl|pt|ru|sk|sr|sv|ta|uk|zh)(?:-[a-z0-9]{1,8})*)\s*(?:;|,|$)" $tag;
}

# Step 2: normalize the browser tag to the locale directory of the website.
# The first matching regex wins, so regional variants come before base languages.
map $kimai_lang_tag $kimai_lang {
    default en;
    "~*^pt-br(?:-|$)" pt_BR;
    "~*^zh-hans(?:-|$)" zh_Hans;
    "~*^zh-hant(?:-|$)" zh_Hant;
    "~*^(?:zh-tw|zh-hk|zh-mo)(?:-|$)" zh_Hant;
    "~*^(?:zh-cn|zh-sg|zh)(?:-|$)" zh_Hans;
    "~*^ca(?:-|$)" ca;
    "~*^cs(?:-|$)" cs;
    "~*^de(?:-|$)" de;
    "~*^en(?:-|$)" en;
    "~*^es(?:-|$)" es;
    "~*^fr(?:-|$)" fr;
    "~*^he(?:-|$)" he;
    "~*^hr(?:-|$)" hr;
    "~*^it(?:-|$)" it;
    "~*^nl(?:-|$)" nl;
    "~*^pl(?:-|$)" pl;
    "~*^pt(?:-|$)" pt;
    "~*^ru(?:-|$)" ru;
    "~*^sk(?:-|$)" sk;
    "~*^sr(?:-|$)" sr;
    "~*^sv(?:-|$)" sv;
    "~*^ta(?:-|$)" ta;
    "~*^uk(?:-|$)" uk;
}
